name: Repo CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fases/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint jq

      - name: Check shell syntax with bash -n
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run shellcheck on scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Validate JSON assets with jq
        run: |
          find apisix terraform/dashboards -type f -name '*.json' -print0 | xargs -0 -n1 jq empty

      - name: Validate GitHub workflow syntax
        uses: raven-actions/actionlint@v2

      - name: Lint YAML with yamllint
        run: |
          yamllint .github helm-values k8s-manifests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.5

      - name: Check Terraform format
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Validate Terraform config
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
