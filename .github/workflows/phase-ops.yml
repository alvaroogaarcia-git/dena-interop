name: Phase Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against the local stack.
        required: true
        default: verify-all
        type: choice
        options:
          - verify-all
          - verify-fase10
          - verify-fase11
          - verify-fase11b
          - verify-fase15-nifi
          - verify-fase12-keycloak
          - verify-fase13
          - verify-fase14
          - verify-fase15
          - verify-fase19
          - verify-fase20
          - verify-fase21
          - apply-fase12-keycloak
          - apply-fase14-grafana
          - apply-fase15-datalake
          - apply-fase19-datos-externos
          - provision-fase20-datos-externos-nifi
          - apply-fase21-demo-explorer
          - provision-fase15-nifi
          - load-expedientes
          - apply-dena-api
          - apply-fase13-apisix
          - preflight-fase8
          - recover-fase7
      runner_labels_json:
        description: JSON array for runs-on labels.
        required: true
        default: '["self-hosted"]'

permissions:
  contents: read

concurrency:
  group: phase-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-ops:
    name: Run phase operation
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}

    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      FASE12_KEYCLOAK_ENV_B64: ${{ secrets.FASE12_KEYCLOAK_ENV_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Restore local kubeconfig
        if: env.KUBECONFIG_B64 != ''
        run: |
          KUBECONFIG_PATH="$GITHUB_WORKSPACE/.github/tmp/dena-config"
          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Restore Keycloak phase env
        if: env.FASE12_KEYCLOAK_ENV_B64 != ''
        run: |
          mkdir -p .local
          printf '%s' "$FASE12_KEYCLOAK_ENV_B64" | base64 -d > .local/fase12-keycloak.env
          chmod 600 .local/fase12-keycloak.env

      - name: Check required tools
        run: |
          for bin in bash kubectl curl helm terraform; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "Missing required binary: $bin" >&2
              exit 1
            }
          done
          kubectl version --client=true
          helm version --short
          terraform version

      - name: Run operation
        run: |
          case "${{ inputs.operation }}" in
            verify-all)
              bash scripts/verify-stack.sh           # Verifica stack completo y accesos demo.
              ;;
            verify-fase10)
              bash scripts/verify-fase10.sh          # Comprueba datalake y PostgREST.
              ;;
            verify-fase11)
              bash scripts/verify-fase11.sh          # Comprueba NiFi desplegado y accesible.
              ;;
            verify-fase11b)
              bash scripts/verify-fase11b.sh         # Comprueba verticales, Mathesar y JDBC.
              ;;
            verify-fase15-nifi)
              bash scripts/verify-fase15-nifi.sh     # Comprueba el flujo incremental de NiFi.
              ;;
            verify-fase12-keycloak)
              bash scripts/verify-fase12-keycloak.sh # Comprueba configuracion y tokens de Keycloak.
              ;;
            verify-fase13)
              bash scripts/verify-fase13.sh          # Comprueba OIDC en APISIX y endpoint DENA.
              ;;
            verify-fase14)
              bash scripts/verify-fase14.sh          # Comprueba Grafana gestionado por Terraform.
              ;;
            verify-fase15)
              bash scripts/verify-fase15.sh          # Comprueba SQL DENA y staging del datalake.
              ;;
            verify-fase19)
              bash scripts/verify-fase19-datos-externos.sh # Comprueba datos externos DENA.
              ;;
            verify-fase20)
              bash scripts/verify-fase20-datos-externos-nifi.sh # Comprueba NiFi hacia datos externos.
              ;;
            verify-fase21)
              bash scripts/verify-fase21-demo-explorer.sh # Comprueba explorador demo de datos externos.
              ;;
            apply-fase12-keycloak)
              bash scripts/dena/apply-fase12-keycloak.sh # Aplica recursos Terraform de Keycloak.
              bash scripts/verify-fase12-keycloak.sh     # Verifica el resultado.
              ;;
            apply-fase14-grafana)
              bash scripts/dena/apply-fase14-grafana.sh # Ajusta Helm y aplica Terraform en Grafana.
              bash scripts/verify-fase14.sh             # Verifica el resultado.
              ;;
            apply-fase15-datalake)
              bash scripts/dena/apply-fase15-datalake.sh # Aplica SQL DENA del datalake.
              bash scripts/verify-fase15.sh              # Verifica el resultado.
              ;;
            apply-fase19-datos-externos)
              bash scripts/dena/apply-fase19-datos-externos.sh # Aplica PostgreSQL y SQL de datos externos.
              bash scripts/verify-fase19-datos-externos.sh     # Verifica el resultado.
              ;;
            provision-fase20-datos-externos-nifi)
              bash scripts/dena/provision-fase20-datos-externos-nifi.sh # Crea flujo NiFi hacia datos externos.
              bash scripts/verify-fase20-datos-externos-nifi.sh         # Verifica el resultado.
              ;;
            apply-fase21-demo-explorer)
              bash scripts/dena/apply-fase21-demo-explorer.sh # Aplica explorador demo de datos externos.
              bash scripts/verify-stack.sh                    # Verifica el stack completo.
              ;;
            provision-fase15-nifi)
              bash scripts/dena/provision-fase15-nifi.sh # Crea el flujo incremental de NiFi.
              bash scripts/verify-fase15-nifi.sh         # Verifica que quede operativo.
              ;;
            load-expedientes)
              bash scripts/dena/load-expedientes.sh      # Carga o refresca expedientes demo.
              ;;
            apply-dena-api)
              bash scripts/dena/apply-dena-api.sh        # Aplica SQL y sincronizacion de API DENA.
              bash scripts/verify-fase13.sh              # Verifica acceso por gateway.
              ;;
            apply-fase13-apisix)
              bash scripts/dena/apply-route.sh           # Publica rutas y upstreams de APISIX.
              bash scripts/verify-fase13.sh              # Verifica el gateway.
              ;;
            preflight-fase8)
              bash scripts/preflight-fase8.sh            # Ejecuta comprobaciones previas.
              ;;
            recover-fase7)
              bash scripts/recover-fase7.sh              # Recupera observabilidad base.
              bash scripts/preflight-fase8.sh            # Repite el preflight tras la recuperacion.
              ;;
            *)
              echo "Unsupported operation: ${{ inputs.operation }}" >&2
              exit 1
              ;;
          esac
