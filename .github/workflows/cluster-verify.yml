name: Cluster Verify

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verification scope to run.
        required: true
        default: all
        type: choice
        options:
          - all
          - fase10
          - fase11
          - fase11b
          - fase12-nifi
          - fase12-keycloak
          - fase13
          - fase14
          - fase15
      runner_labels_json:
        description: JSON array for runs-on labels.
        required: true
        default: '["self-hosted"]'

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed stack
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}

    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      FASE12_KEYCLOAK_ENV_B64: ${{ secrets.FASE12_KEYCLOAK_ENV_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Restore local kubeconfig
        if: env.KUBECONFIG_B64 != ''
        run: |
          KUBECONFIG_PATH="$GITHUB_WORKSPACE/.github/tmp/dena-config"
          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Restore Keycloak phase env
        if: env.FASE12_KEYCLOAK_ENV_B64 != ''
        run: |
          mkdir -p .local
          printf '%s' "$FASE12_KEYCLOAK_ENV_B64" | base64 -d > .local/fase12-keycloak.env
          chmod 600 .local/fase12-keycloak.env

      - name: Check required tools
        run: |
          for bin in bash kubectl curl helm; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "Missing required binary: $bin" >&2
              exit 1
            }
          done
          kubectl version --client=true
          helm version --short

      - name: Cluster summary
        run: |
          kubectl get nodes -o wide
          kubectl get pods,svc,pvc -n auth -o wide
          kubectl get pods,svc,pvc -n gateway -o wide
          kubectl get pods,svc,pvc -n monitoring -o wide
          kubectl get pods,svc,pvc -n datalake -o wide
          kubectl get pods,svc,pvc -n verticales -o wide
          helm list -A

      - name: Run selected verification scripts
        run: |
          case "${{ inputs.phase }}" in
            all)
              bash scripts/verify-fase10.sh          # Verifica datalake y PostgREST.
              bash scripts/verify-fase11.sh          # Verifica NiFi.
              bash scripts/verify-fase11b.sh         # Verifica verticales y Mathesar.
              bash scripts/verify-fase12.sh          # Verifica flujo incremental de NiFi.
              bash scripts/verify-fase12-keycloak.sh # Verifica Keycloak.
              bash scripts/verify-fase13.sh          # Verifica APISIX OIDC y API DENA.
              bash scripts/verify-fase14.sh          # Verifica Grafana en Terraform.
              bash scripts/verify-fase15.sh          # Verifica SQL DENA y staging del datalake.
              ;;
            fase10)
              bash scripts/verify-fase10.sh          # Verifica PostgreSQL datalake y PostgREST.
              ;;
            fase11)
              bash scripts/verify-fase11.sh          # Verifica despliegue y acceso de NiFi.
              ;;
            fase11b)
              bash scripts/verify-fase11b.sh         # Verifica verticales, Mathesar y JDBC.
              ;;
            fase12-nifi)
              bash scripts/verify-fase12.sh          # Verifica el flujo incremental de NiFi.
              ;;
            fase12-keycloak)
              bash scripts/verify-fase12-keycloak.sh # Verifica realm, clientes y tokens.
              ;;
            fase13)
              bash scripts/verify-fase13.sh          # Verifica OIDC en APISIX y API DENA.
              ;;
            fase14)
              bash scripts/verify-fase14.sh          # Verifica datasources y dashboards de Grafana.
              ;;
            fase15)
              bash scripts/verify-fase15.sh          # Verifica SQL DENA y staging del datalake.
              ;;
            *)
              echo "Unsupported phase: ${{ inputs.phase }}" >&2
              exit 1
              ;;
          esac
