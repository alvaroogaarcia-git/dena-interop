alertmanager:
  enabled: false

defaultRules:
  create: false

grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 31803
    port: 80
    targetPort: 3000
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  sidecar:
    dashboards:
      provider:
        allowUiUpdates: true
    datasources:
      enabled: false
      alertmanager:
        enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

prometheusOperator:
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: ""
    scrapeInterval: 60s
    evaluationInterval: 60s
    storageSpec: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 640Mi

kube-state-metrics:
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
