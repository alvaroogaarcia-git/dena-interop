apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nifi-extensions
  namespace: datalake
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi
  namespace: datalake
  labels:
    app: nifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: nifi
          image: docker.io/apache/nifi:2.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_WEB_HTTPS_PORT
              value: "8443"
            - name: NIFI_WEB_HTTPS_HOST
              value: "0.0.0.0"
            - name: NIFI_WEB_PROXY_HOST
              value: "localhost:8443"
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nifi-secret
                  key: single-user-username
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nifi-secret
                  key: single-user-password
            - name: NIFI_JVM_HEAP_INIT
              value: 256m
            - name: NIFI_JVM_HEAP_MAX
              value: 256m
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /nifi/
              port: 8443
              httpHeaders:
                - name: Host
                  value: localhost:8443
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /nifi/
              port: 8443
              httpHeaders:
                - name: Host
                  value: localhost:8443
            initialDelaySeconds: 900
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: extensions
              mountPath: /opt/nifi/nifi-current/extensions
      volumes:
        - name: extensions
          persistentVolumeClaim:
            claimName: nifi-extensions
---
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: datalake
  labels:
    app: nifi
spec:
  type: NodePort
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30821
