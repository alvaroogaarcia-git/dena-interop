apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathesar
  namespace: verticales
  labels:
    app: mathesar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mathesar
  template:
    metadata:
      labels:
        app: mathesar
    spec:
      containers:
        - name: mathesar
          image: docker.io/mathesar/mathesar:0.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: DOMAIN_NAME
              value: http://192.168.56.15:30900
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DEBUG
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mathesar-secret
                  key: secret-key
            - name: POSTGRES_HOST
              value: postgresql-verticales.verticales.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mathesar_django
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mathesar-secret
                  key: db-password
            - name: WEB_CONCURRENCY
              value: "1"
            - name: PER_USER_DATABASES_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 5m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: static
              mountPath: /code/static
            - name: media
              mountPath: /code/.media
            - name: secrets
              mountPath: /code/.secrets
      volumes:
        - name: static
          emptyDir: {}
        - name: media
          emptyDir: {}
        - name: secrets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mathesar
  namespace: verticales
  labels:
    app: mathesar
spec:
  type: NodePort
  selector:
    app: mathesar
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30900
