          };

          function setStatus(message, kind = "") {
            statusEl.textContent = message;
            statusEl.className = `status ${kind}`;
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function walkTextNodes(root, callback) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
              acceptNode(node) {
                const parent = node.parentElement;
                if (!parent || ["SCRIPT", "STYLE", "PRE", "CODE"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
                return node.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
              }
            });
            let node = walker.nextNode();
            while (node) {
              callback(node);
              node = walker.nextNode();
            }
          }

          function translateText(text, lang) {
            if (lang === "es") return text;
            return translations[lang]?.[text] || text;
          }

          function applyLanguage(lang) {
            document.documentElement.lang = lang;
            localStorage.setItem("denaClientLanguage", lang);
            walkTextNodes(document.body, (node) => {
              const source = node.i18nSource || node.textContent.trim();
              node.i18nSource = source;
              node.textContent = node.textContent.replace(node.textContent.trim(), translateText(source, lang));
            });
            themeToggle.textContent = document.documentElement.dataset.theme === "dark"
              ? translateText("Claro", lang)
              : translateText("Oscuro", lang);
            updatePanelHelp();
            rerenderLanguageSensitiveData();
          }

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("denaClientTheme", theme);
            themeToggle.textContent = theme === "dark"
              ? translateText("Claro", languageSelect.value)
              : translateText("Oscuro", languageSelect.value);
          }

          function panelStorageKey(panel, index) {
            const title = String(panel.querySelector("h2")?.textContent || `panel-${index}`)
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");
            return `denaClientPanelCollapsed:${title}:${index}`;
          }

          function panelHelpText(panel) {
            const title = panel.querySelector("h2")?.textContent.trim() || "";
            const description = panel.querySelector(".panel-head p")?.textContent.trim() || "";
            const lang = languageSelect.value;
            if (lang === "en") return description ? `${title}: ${description}` : `Shows or hides ${title}.`;
            if (lang === "eu") return description ? `${title}: ${description}` : `${title} panela zabaldu edo tolestu.`;
            return description ? `${title}: ${description}` : `Muestra u oculta el panel ${title}.`;
          }

          function updatePanelHelp() {
            document.querySelectorAll(".panel").forEach((panel) => {
              const help = panel.querySelector(":scope > .panel-head .panel-help");
              const toggle = panel.querySelector(":scope > .panel-head .panel-toggle");
              if (help) {
                help.title = panelHelpText(panel);
                help.setAttribute("aria-label", help.title);
              }
              if (toggle) {
                const collapsed = panel.classList.contains("collapsed");
                const lang = languageSelect.value;
                const label = collapsed
                  ? lang === "en" ? "Expand panel" : lang === "eu" ? "Panela zabaldu" : "Desplegar panel"
                  : lang === "en" ? "Collapse panel" : lang === "eu" ? "Panela tolestu" : "Plegar panel";
                toggle.setAttribute("aria-label", label);
                toggle.title = label;
              }
            });
          }

          function initCollapsiblePanels() {
            document.querySelectorAll(".panel").forEach((panel, index) => {
              const head = panel.querySelector(":scope > .panel-head");
              if (!head) return;
              const content = panel.querySelectorAll(":scope > :not(.panel-head)");
              if (!content.length) return;
              panel.dataset.collapsible = "true";
              const key = panelStorageKey(panel, index);
              let button = head.querySelector(".panel-toggle");
              let controls = head.querySelector(".panel-controls");
              if (!controls) {
                controls = document.createElement("span");
                controls.className = "panel-controls";
                if (button?.parentElement) button.parentElement.replaceChild(controls, button);
                else head.prepend(controls);
                if (button) controls.append(button);
              }
              if (!button) {
                button = document.createElement("button");
                button.type = "button";
                button.className = "panel-toggle";
                controls.prepend(button);
              }
              if (!controls.querySelector(".panel-help")) {
                const help = document.createElement("button");
                help.type = "button";
                help.className = "panel-help";
                help.textContent = "?";
                controls.append(help);
              }
              const setCollapsed = (collapsed) => {
                panel.classList.toggle("collapsed", collapsed);
                content.forEach((node) => node.classList.toggle("panel-content-collapsed", collapsed));
                button.textContent = collapsed ? "+" : "-";
                button.setAttribute("aria-expanded", String(!collapsed));
                sessionStorage.setItem(key, collapsed ? "1" : "0");
                updatePanelHelp();
              };
              setCollapsed(sessionStorage.getItem(key) === "1");
              button.addEventListener("click", () => setCollapsed(!panel.classList.contains("collapsed")));
            });
            updatePanelHelp();
          }

          function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? value : shortDate.format(date);
          }

          function formatDateTime(value) {
            if (!value) return "-";
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? value : dateTime.format(date);
          }

          function formatStatus(value) {
            const label = statusLabel(value);
            return `<span class="badge ${escapeHtml(value)}">${escapeHtml(label)}</span>`;
          }

          function denaLanguageKey(lang = languageSelect.value) {
            if (lang === "eu") return "BASQUE";
            if (lang === "en") return "ENGLISH";
            return "SPANISH";
          }

          function languageText(value, fallback = "-") {
            if (value && typeof value === "object" && !Array.isArray(value)) {
              const key = denaLanguageKey();
              return value[key] || value.SPANISH || value.BASQUE || value.ENGLISH || fallback;
            }
            return value ?? fallback;
          }

          function languageTextFrom(row, textKey, fallbackKeys = []) {
            const byLanguage = row?.[`${textKey}_by_language`];
            if (byLanguage) return languageText(byLanguage, row?.[textKey] || "-");
            return externalValue(row || {}, [textKey].concat(fallbackKeys), "-");
          }

          function statusLabel(value) {
            return statusOrValue(value, translateText("Sin estado", languageSelect.value));
          }

          function statusOrValue(value, fallback = "-") {
            if (!value || value === "-") return fallback;
            return languageText(statusLanguageTexts[value], statusLabels[value] || value);
          }

          function rerenderLanguageSensitiveData() {
            if (lastRows.length) {
              renderSummary(lastRows);
              renderCharts(lastRows);
              renderTable(lastRows);
              renderSession(session);
            }
            if (citizenRows.length) renderCitizenDataTable(citizenRows);
            if (Object.keys(citizenFolderData).length) {
              renderAttention(citizenFolderData);
              renderTimeline(citizenFolderData);
            }
          }

          function normalizeText(value) {
            return String(value || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .trim();
          }

          function dateOnly(value) {
            if (!value) return null;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
          }

          function readFilters() {
            const data = new FormData(form);
            const requestBody = { p_limit: Number(data.get("limit") || 10) };
            const title = data.get("titleFilter");
            const code = data.get("codeFilter");
            const dateFrom = data.get("dateFrom");
            const dateTo = data.get("dateTo");
            const citizenId = String(data.get("citizenFilter") || "").trim();
            if (data.get("statusFilter")) requestBody.p_status = data.get("statusFilter");
            if (title) requestBody.p_title = title;
            if (code) requestBody.p_code = code;
            if (dateFrom) requestBody.p_opened_from = `${dateFrom}T00:00:00Z`;
            if (dateTo) requestBody.p_opened_to = `${dateTo}T23:59:59Z`;
            return {
              requestBody,
              local: { citizenId }
            };
          }

          function applyLocalFilters(rows, filters) {
            const title = normalizeText(filters.title);
            const code = normalizeText(filters.code);
            const from = filters.dateFrom ? new Date(`${filters.dateFrom}T00:00:00`) : null;
            const to = filters.dateTo ? new Date(`${filters.dateTo}T23:59:59`) : null;

            return rows.filter((row) => {
              const rowTitle = normalizeText(row.title);
              const rowCode = normalizeText(row.expediente_code || row.id);
              const rowCitizen = normalizeText(row.citizen_id);
              const openedAt = dateOnly(row.opened_at);
              if (title && !rowTitle.includes(title)) return false;
              if (code && !rowCode.includes(code)) return false;
              if (filters.citizenId && rowCitizen !== normalizeText(filters.citizenId)) return false;
              if (from && (!openedAt || openedAt < from)) return false;
              if (to && (!openedAt || openedAt > to)) return false;
              return true;
            });
          }

          function decodeJwt(token) {
            if (!token || !token.includes(".")) return {};
            try {
              const payload = token.split(".")[1].replaceAll("-", "+").replaceAll("_", "/");
              return JSON.parse(atob(payload.padEnd(Math.ceil(payload.length / 4) * 4, "=")));
            } catch {
              return {};
            }
          }

          function loadStoredSession() {
            try {
              return JSON.parse(sessionStorage.getItem("denaClientSession") || "null");
            } catch {
              return null;
            }
          }

          function storeSession(nextSession) {
            session = nextSession;
            sessionStorage.setItem("denaClientSession", JSON.stringify(nextSession));
            renderSession(nextSession);
          }

          function clearLocalSession() {
            session = null;
            sessionStorage.removeItem("denaClientSession");
            sessionStorage.removeItem("denaClientPkceVerifier");
            sessionStorage.removeItem("denaClientPkceState");
            sessionStorage.removeItem("denaClientPendingQuery");
          }

          function randomBase64Url(bytes = 32) {
            const values = new Uint8Array(bytes);
            crypto.getRandomValues(values);
            return btoa(String.fromCharCode(...values)).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
          }

          function base64UrlFromBytes(bytes) {
            return btoa(String.fromCharCode(...bytes)).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
          }

          function rightRotate(value, amount) {
            return (value >>> amount) | (value << (32 - amount));
          }

          function sha256Bytes(messageBytes) {
            const constants = [
              0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
              0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
              0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
              0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
              0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
              0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
              0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
              0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            const hash = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const bitLength = messageBytes.length * 8;
            const totalLength = messageBytes.length + 1 + ((64 - ((messageBytes.length + 1 + 8) % 64)) % 64) + 8;
            const bytes = new Uint8Array(totalLength);
            bytes.set(messageBytes);
            bytes[messageBytes.length] = 0x80;
            const view = new DataView(bytes.buffer);
            view.setUint32(totalLength - 8, Math.floor(bitLength / 0x100000000));
            view.setUint32(totalLength - 4, bitLength >>> 0);
            const words = new Uint32Array(64);
            for (let offset = 0; offset < totalLength; offset += 64) {
              for (let index = 0; index < 16; index += 1) words[index] = view.getUint32(offset + index * 4);
              for (let index = 16; index < 64; index += 1) {
                const s0 = rightRotate(words[index - 15], 7) ^ rightRotate(words[index - 15], 18) ^ (words[index - 15] >>> 3);
                const s1 = rightRotate(words[index - 2], 17) ^ rightRotate(words[index - 2], 19) ^ (words[index - 2] >>> 10);
                words[index] = (words[index - 16] + s0 + words[index - 7] + s1) >>> 0;
              }
              let [a, b, c, d, e, f, g, h] = hash;
              for (let index = 0; index < 64; index += 1) {
                const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
                const ch = (e & f) ^ (~e & g);
                const temp1 = (h + s1 + ch + constants[index] + words[index]) >>> 0;
                const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
                const maj = (a & b) ^ (a & c) ^ (b & c);
                const temp2 = (s0 + maj) >>> 0;
                h = g; g = f; f = e; e = (d + temp1) >>> 0; d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
              }
              [a, b, c, d, e, f, g, h].forEach((value, index) => { hash[index] = (hash[index] + value) >>> 0; });
            }
            const digest = new Uint8Array(32);
            const digestView = new DataView(digest.buffer);
            hash.forEach((value, index) => digestView.setUint32(index * 4, value));
            return digest;
          }

          async function sha256Base64Url(value) {
            const data = new TextEncoder().encode(value);
            if (crypto.subtle) {
              const digest = await crypto.subtle.digest("SHA-256", data);
              return base64UrlFromBytes(new Uint8Array(digest));
            }
            return base64UrlFromBytes(sha256Bytes(data));
          }

          async function startLogin() {
            if (window.location.origin !== oidcOrigin) {
              window.location.assign(`${oidc.redirectUri}?autoload=1`);
              throw new Error("Redirigiendo a localhost:30080 para completar OIDC/WebAuthn.");
            }
            const verifier = randomBase64Url(64);
            const state = randomBase64Url(24);
            const challenge = await sha256Base64Url(verifier);
            sessionStorage.setItem("denaClientPkceVerifier", verifier);
            sessionStorage.setItem("denaClientPkceState", state);
            sessionStorage.setItem("denaClientPendingQuery", "1");
            const params = new URLSearchParams({
              client_id: oidc.clientId,
              redirect_uri: oidc.redirectUri,
              response_type: "code",
              scope: "openid",
              state,
              code_challenge: challenge,
              code_challenge_method: "S256"
            });
            window.location.assign(`${oidc.authUrl}?${params}`);
          }

          async function exchangeCode(code, state) {
            const expectedState = sessionStorage.getItem("denaClientPkceState");
            const verifier = sessionStorage.getItem("denaClientPkceVerifier");
            if (!expectedState || !verifier || state !== expectedState) throw new Error("Estado OIDC inválido.");
            const response = await fetch(oidc.tokenUrl, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                client_id: oidc.clientId,
                grant_type: "authorization_code",
                code,
                redirect_uri: oidc.redirectUri,
                code_verifier: verifier
              })
            });
            if (!response.ok) throw new Error(`Keycloak no pudo completar el login. HTTP ${response.status}.`);
            sessionStorage.removeItem("denaClientPkceVerifier");
            sessionStorage.removeItem("denaClientPkceState");
            storeSession(await response.json());
            window.history.replaceState({}, document.title, oidc.redirectUri);
          }

          async function handleAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");
            const error = params.get("error");
            if (error) {
              window.history.replaceState({}, document.title, oidc.redirectUri);
              throw new Error(params.get("error_description") || error);
            }
            if (!code) return false;
            setStatus("Completando autenticación OIDC...");
            await exchangeCode(code, state);
            const shouldQuery = sessionStorage.getItem("denaClientPendingQuery") === "1";
            sessionStorage.removeItem("denaClientPendingQuery");
            if (shouldQuery) await runQuery(false);
            return true;
          }

          function tokenIsUsable(tokenJson) {
            const claims = decodeJwt(tokenJson?.access_token);
            if (!claims.exp) return false;
            return claims.exp * 1000 > Date.now() + 30000;
          }

          function renderSession(tokenJson = null) {
            if (!tokenJson) {
              sessionLabel.textContent = "Aún no hay token emitido.";
              sessionGrid.innerHTML = `
                <div class="session-item"><span>Usuario</span><strong>-</strong></div>
                <div class="session-item"><span>Expira</span><strong>-</strong></div>
                <div class="session-item"><span>Estado</span><strong>Sin iniciar</strong></div>
                <div class="session-item"><span>Consulta</span><strong>-</strong></div>
              `;
              return;
            }
            const claims = decodeJwt(tokenJson.access_token);
            const expiresAt = claims.exp ? new Date(claims.exp * 1000) : null;
            sessionLabel.textContent = "Sesión iniciada para esta consulta.";
            sessionGrid.innerHTML = `
              <div class="session-item"><span>Usuario</span><strong>${escapeHtml(claims.preferred_username || claims.sub || "-")}</strong></div>
              <div class="session-item"><span>Expira</span><strong>${expiresAt ? dateTime.format(expiresAt) : "-"}</strong></div>
              <div class="session-item"><span>Estado</span><strong>Activa</strong></div>
              <div class="session-item"><span>Consulta</span><strong>${lastRows.length ? `${lastRows.length} expedientes` : "-"}</strong></div>
            `;
          }

          function renderSummary(rows) {
            const totalAmount = rows.reduce((sum, row) => sum + Number(row.amount_eur || 0), 0);
            const latest = rows
              .map((row) => new Date(row.updated_at))
              .filter((date) => !Number.isNaN(date.getTime()))
              .sort((a, b) => b - a)[0];
            const sources = new Set(rows.map((row) => row.source_system).filter(Boolean));
            summaryEl.innerHTML = `
              <div class="metric"><span>Expedientes</span><strong>${rows.length}</strong></div>
              <div class="metric"><span>Importe total</span><strong>${currency.format(totalAmount)}</strong></div>
              <div class="metric"><span>Última actualización</span><strong>${latest ? shortDate.format(latest) : "-"}</strong></div>
              <div class="metric"><span>Organismos</span><strong>${sources.size}</strong></div>
            `;
          }

          function groupRows(rows, valueFn) {
            return rows.reduce((acc, row) => {
              const key = row.status || "sin_estado";
              acc[key] = (acc[key] || 0) + valueFn(row);
              return acc;
            }, {});
          }

          function renderBars(target, values, formatter, className = "") {
            const entries = Object.entries(values).sort((a, b) => b[1] - a[1]);
            if (!entries.length) {
              target.innerHTML = '<div class="empty">Sin datos.</div>';
              return;
            }
            const max = Math.max(...entries.map(([, value]) => value), 1);
            target.innerHTML = entries.map(([key, value]) => {
              const width = Math.max(4, Math.round((value / max) * 100));
              return `
                <div class="bar-row">
                  <strong>${escapeHtml(statusLabels[key] || key)}</strong>
                  <div class="bar-track"><div class="bar-fill ${className}" style="width:${width}%"></div></div>
                  <span>${escapeHtml(formatter(value))}</span>
                </div>
              `;
            }).join("");
          }

          function renderCharts(rows) {
            renderBars(statusChart, groupRows(rows, () => 1), (value) => String(value));
            renderBars(amountChart, groupRows(rows, (row) => Number(row.amount_eur || 0)), (value) => currency.format(value), "amount");
          }

          function renderDetail(row = null) {
            if (!row) {
              detailPanel.innerHTML = '<div class="empty">Selecciona un expediente para ver su detalle.</div>';
              return;
            }
            const guidance = citizenGuidance(row);
            detailPanel.innerHTML = `
              <div class="detail-head">
                <h3>${escapeHtml(row.expediente_code || row.id || "Expediente")}</h3>
                ${formatStatus(row.status)}
              </div>
              <div class="detail-grid">
                <div class="detail-item"><span>Título</span><strong>${escapeHtml(languageText(row.titleByLanguage, row.title || "-"))}</strong></div>
                <div class="detail-item"><span>Ciudadano</span><strong>${escapeHtml(row.citizen_id || "-")}</strong></div>
                <div class="detail-item"><span>Organismo</span><strong>${escapeHtml(languageText(row.sourceSystemByLanguage, row.source_system || "-"))}</strong></div>
                <div class="detail-item"><span>Importe</span><strong>${currency.format(Number(row.amount_eur || 0))}</strong></div>
                <div class="detail-item"><span>Apertura</span><strong>${formatDateTime(row.opened_at)}</strong></div>
                <div class="detail-item"><span>Actualización</span><strong>${formatDateTime(row.updated_at)}</strong></div>
              </div>
              <div class="citizen-guide">
                <h4>Resumen para el ciudadano</h4>
                <p>${escapeHtml(guidance.message)}</p>
                <p><strong>Próximo paso:</strong> ${escapeHtml(guidance.nextStep)}</p>
                <ul>
                  ${guidance.actions.map((action) => `<li>${escapeHtml(action)}</li>`).join("")}
                </ul>
                <div class="notice ${guidance.kind}">${escapeHtml(guidance.notice)}</div>
              </div>
            `;
          }

          function citizenGuidance(row) {
            if (row.status === "resuelto") {
              return {
                kind: "",
                message: "El expediente ya tiene resolución registrada por la administración competente.",
                nextStep: "Revisar la resolución y conservar el justificante.",
                actions: ["Descargar justificante demo", "Consultar importe reconocido", "Contactar con el organismo si hay discrepancias"],
                notice: "Notificación demo: tu expediente ha cambiado a resuelto."
              };
            }
            if (row.status === "pendiente_documentacion") {
              return {
                kind: "warn",
                message: "La tramitación está detenida hasta que se aporte documentación adicional.",
                nextStep: "Preparar y presentar la documentación pendiente.",
                actions: ["Revisar requisitos", "Preparar documentación", "Solicitar ayuda si no entiendes el requerimiento"],
                notice: "Notificación demo: falta documentación para continuar."
              };
            }
            if (row.status === "en_tramitacion") {
              return {
                kind: "",
                message: "El expediente está siendo revisado. No tienes que realizar ninguna acción inmediata.",
                nextStep: "Esperar nueva actualización.",
                actions: ["Consultar estado periódicamente", "Guardar el número de expediente", "Ver organismo responsable"],
                notice: "Notificación demo: expediente actualizado por la administración."
              };
            }
            if (row.status === "archivado") {
              return {
                kind: "warn",
                message: "El expediente está archivado y no tiene tramitación activa.",
                nextStep: "Contactar con el organismo responsable si necesitas reabrirlo.",
                actions: ["Revisar fecha de archivo", "Consultar organismo", "Solicitar reapertura si procede"],
                notice: "Notificación demo: expediente archivado."
              };
            }
            return {
              kind: "",
              message: "El expediente está abierto y pendiente de actuaciones administrativas.",
              nextStep: "Esperar el inicio de la tramitación o nuevas comunicaciones.",
              actions: ["Guardar el número de expediente", "Consultar actualizaciones", "Revisar datos básicos"],
              notice: "Notificación demo: expediente abierto correctamente."
            };
          }

          function renderTable(rows) {
            selectedIndex = rows.length ? 0 : null;
            if (!rows.length) {
              tableWrap.innerHTML = '<div class="empty">La consulta no devolvió expedientes. Revisa filtros o usa otro escenario.</div>';
              resultLabel.textContent = "No hay expedientes para los filtros seleccionados.";
              renderDetail(null);
              return;
            }
            resultLabel.textContent = `${rows.length} expedientes encontrados. Pulsa una fila para ver el detalle.`;
            tableWrap.innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>Expediente</th>
                    <th>Título</th>
                    <th>Estado</th>
                    <th>Importe</th>
                    <th>Apertura</th>
                    <th>Actualizado</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((row, index) => `
                    <tr tabindex="0" data-index="${index}" class="${index === 0 ? "selected" : ""}">
                      <td class="code" data-label="Expediente">${escapeHtml(row.expediente_code || row.id)}</td>
                      <td class="title-cell" data-label="Título">
                        ${escapeHtml(languageText(row.titleByLanguage, row.title))}
                        <small>${escapeHtml(row.citizen_id)} · ${escapeHtml(row.source_system)}</small>
                      </td>
                      <td data-label="Estado">${formatStatus(row.status)}</td>
                      <td data-label="Importe">${currency.format(Number(row.amount_eur || 0))}</td>
                      <td data-label="Apertura">${formatDate(row.opened_at)}</td>
                      <td data-label="Actualizado">${formatDate(row.updated_at)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;
            renderDetail(rows[0]);
          }

          function renderPayload(payload, filters = {}) {
            const rows = Array.isArray(payload) ? applyLocalFilters(payload, filters) : [];
            lastRows = rows;
            lastPayload = payload;
            renderSummary(rows);
            renderCharts(rows);
            renderTable(rows);
            renderSession(session);
          }

          function externalExpedienteToClientRow(row) {
            return {
              id: row.id,
              expediente_code: row.id,
              title: languageText(row.titulo_by_language, row.titulo),
              titleByLanguage: row.titulo_by_language,
              citizen_id: row.persona_id,
              source_system: row.administracion || languageText(row.servicio_by_language, row.servicio) || "datos_externos",
              sourceSystemByLanguage: row.servicio_by_language,
              status: denaStateMap[row.estado] || "abierto",
              amount_eur: Number(row.detalle?.raw_payload?.amountHint || 0),
              opened_at: row.creado_en || row.fecha,
              updated_at: row.fecha || row.sincronizado_en,
              ingested_at: row.sincronizado_en,
              external_state: row.estado
            };
          }

          function renderExternalExpedientesAsMain(rows) {
            const mappedRows = rows.map(externalExpedienteToClientRow);
            lastRows = mappedRows;
            renderSummary(mappedRows);
            renderCharts(mappedRows);
            renderTable(mappedRows);
            renderSession(session);
          }

          function friendlyError(scope, response) {
            if (scope === "token") {
              if (response.status === 400 || response.status === 401) return "Keycloak no pudo completar el login.";
              return `Keycloak no pudo emitir token. HTTP ${response.status}.`;
            }
            if (response.status === 401 || response.status === 403) return "No tienes permiso para consultar estos expedientes.";
            if (response.status >= 500) return "El servicio no está disponible en este momento. Inténtalo de nuevo más tarde.";
            return `No se pudo completar la consulta. HTTP ${response.status}.`;
          }

          async function getToken() {
            if (tokenIsUsable(session)) return session;
            setStatus("Redirigiendo a Keycloak...");
            await startLogin();
            throw new Error("Redirección a Keycloak iniciada.");
          }

          async function runQuery(forceToken = false) {
            const filters = readFilters();
            submitButton.disabled = true;
            lastRequestBody = filters.requestBody;
            setStatus("Iniciando sesión...");
            try {
              const tokenJson = forceToken || !tokenIsUsable(session) ? await getToken() : session;
              setStatus("Consultando expedientes...");
              const apiResponse = await fetch("/dena/admin-files", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${tokenJson.access_token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(filters.requestBody)
              });
              if ((apiResponse.status === 401 || apiResponse.status === 403) && !forceToken) {
                session = null;
                return runQuery(true);
              }
              if (!apiResponse.ok) {
                throw new Error(friendlyError("api", apiResponse));
              }
              const payload = await apiResponse.json();
              renderPayload(payload, filters.local);
              await loadCitizenOverview(tokenJson);
              setStatus(`Consulta correcta: ${lastRows.length} expedientes.`, lastRows.length ? "ok" : "warn");
            } catch (error) {
              tableWrap.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              resultLabel.textContent = "No se pudo completar la consulta.";
              renderCharts([]);
              renderDetail(null);
              setStatus("La consulta ha fallado.", "bad");
            } finally {
              submitButton.disabled = false;
            }
          }

          function selectedCitizenId() {
            const data = new FormData(form);
            const fromInput = String(data.get("citizenFilter") || "").trim();
            if (fromInput) return fromInput;
            return lastRows[0]?.citizen_id || "CIT-10001";
          }

          function renderCitizenFolderButtons() {
            citizenFolderList.querySelectorAll("[data-folder]").forEach((button) => {
              const folder = button.dataset.folder;
              const meta = citizenFolders[folder];
              const total = button.dataset.total || "-";
              button.classList.toggle("active", folder === activeCitizenFolder);
              button.innerHTML = `${escapeHtml(meta.title)} <span>${escapeHtml(total)}</span>`;
            });
          }

          async function fetchCitizenEndpoint(tokenJson, path) {
            const response = await fetch(`/dena/external/${path}`, {
              headers: { Authorization: `Bearer ${tokenJson.access_token}` }
            });
            if (!response.ok) throw new Error(`Datos externos HTTP ${response.status}.`);
            return response.json();
          }

          function externalValue(row, keys, fallback = "-") {
            for (const key of keys) {
              if (row[key] !== undefined && row[key] !== null && row[key] !== "") return row[key];
            }
            return fallback;
          }

          function renderCitizenDataTable(rows) {
            const citizenId = selectedCitizenId();
            const folder = citizenFolders[activeCitizenFolder];
            citizenDataLabel.textContent = `${folder.title} para ${citizenId}: ${rows.length} filas.`;
            if (!rows.length) {
              citizenDataWrap.innerHTML = '<div class="empty">No hay datos en esta carpeta para el ciudadano seleccionado.</div>';
              renderCitizenDataDetail(null);
              return;
            }
            citizenDataWrap.innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>ID</th><th>Título</th><th>Estado</th><th>Relacionado</th><th>Fecha</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((row, index) => `
                    <tr tabindex="0" data-citizen-index="${index}" class="${index === 0 ? "selected" : ""}">
                      <td class="code" data-label="ID">${escapeHtml(externalValue(row, ["id", "referencia"]))}</td>
                      <td class="title-cell" data-label="Título">${escapeHtml(languageTextFrom(row, "titulo", ["servicio", "tabla_sugerida"]))}</td>
                      <td data-label="Estado">${escapeHtml(statusOrValue(externalValue(row, ["estado", "prioridad"]), externalValue(row, ["tipo", "grupo"])))}</td>
                      <td data-label="Relacionado">${escapeHtml(externalValue(row, ["expediente_id", "persona_id", "administracion", "unidad"]))}</td>
                      <td data-label="Fecha">${formatDate(externalValue(row, ["fecha", "sincronizado_en", "creado_en"], ""))}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;
            renderCitizenDataDetail(rows[0]);
          }

          function renderCitizenDataDetail(row) {
            if (!row) {
              citizenDataDetail.innerHTML = '<div class="empty">Selecciona una fila.</div>';
              return;
            }
            const fields = Object.entries(row)
              .filter(([key]) => key !== "detalle")
              .slice(0, 10)
              .map(([key, value]) => `
                <div class="detail-item">
                  <span>${escapeHtml(key)}</span>
                  <strong>${escapeHtml(value instanceof Object ? JSON.stringify(value) : value)}</strong>
                </div>
              `).join("");
            citizenDataDetail.innerHTML = `
              <div class="detail-grid">${fields}</div>
              <pre>${escapeHtml(JSON.stringify(row.detalle || row, null, 2))}</pre>
            `;
          }

          async function loadCitizenData(existingToken = null) {
            const folder = citizenFolders[activeCitizenFolder];
            const citizenId = selectedCitizenId();
            const tokenJson = existingToken || await getToken();
            const query = `${folder.endpoint}?select=*&${folder.filterKey}=eq.${encodeURIComponent(citizenId)}&order=fecha.desc.nullslast&limit=50`;
            citizenRows = await fetchCitizenEndpoint(tokenJson, query);
            citizenFolderData[activeCitizenFolder] = citizenRows;
            renderCitizenDataTable(citizenRows);
            const button = citizenFolderList.querySelector(`[data-folder="${activeCitizenFolder}"]`);
            if (button) button.dataset.total = String(citizenRows.length);
            renderCitizenFolderButtons();
          }

          function eventDate(row) {
            const value = externalValue(row, ["fecha", "sincronizado_en", "creado_en"], "");
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? null : date;
          }

          function addTimelineEvent(events, folder, row, label) {
            const date = eventDate(row) || new Date(0);
            events.push({
              folder,
              date,
              title: languageTextFrom(row, "titulo", ["id"]) || label,
              subtitle: `${label} · ${statusOrValue(externalValue(row, ["estado", "prioridad"]), externalValue(row, ["tipo", "grupo"], "sin estado"))}`,
              related: externalValue(row, ["expediente_id", "persona_id", "id"], "")
            });
          }

          function attentionFromData(data) {
            const items = [];
            (data.expedientes || []).forEach((row) => {
              if (["WAITING_FOR_INTERESTED_PARTY_RESPONSE", "OPENED"].includes(row.estado)) {
                items.push({
                  kind: row.estado === "WAITING_FOR_INTERESTED_PARTY_RESPONSE" ? "bad" : "warn",
                  title: `${row.id}: expediente requiere revisión`,
                  text: row.estado === "WAITING_FOR_INTERESTED_PARTY_RESPONSE"
                    ? "La administración espera una respuesta o documentación del ciudadano."
                    : "El expediente está abierto y pendiente de avance administrativo."
                });
              }
            });
            (data.notificaciones || []).forEach((row) => {
              if (row.estado === "PENDING_TO_BE_READED_BY_DESTINATION") {
                items.push({ kind: "bad", title: `${row.id}: notificación pendiente`, text: "Hay una notificación pendiente de lectura." });
              }
            });
            (data.pagos || []).forEach((row) => {
              if (["PENDING", "REJECTED_BY_PAYMENT_PROCESSOR", "ERROR_WHEN_PROCESSING_PAYMENT"].includes(row.estado)) {
                items.push({ kind: "bad", title: `${row.id}: ${statusLabel("PENDING")}`, text: `${languageTextFrom(row, "titulo")} · ${currency.format(Number(row.importe_eur || 0))}` });
              }
            });
            (data.citas || []).forEach((row) => {
              const date = eventDate(row);
              const upcoming = date && date.getTime() > Date.now() && date.getTime() < Date.now() + 30 * 24 * 60 * 60 * 1000;
              if (upcoming || row.prioridad === "HIGH") {
                items.push({ kind: row.prioridad === "HIGH" ? "bad" : "warn", title: `${row.id}: cita próxima`, text: `${formatDateTime(row.fecha)} · ${externalValue(row, ["ubicacion"], "ubicación pendiente")}` });
              }
            });
            return items.slice(0, 8);
          }

          function renderAttention(data) {
            const items = attentionFromData(data);
            if (!items.length) {
              attentionList.innerHTML = '<div class="empty">No hay avisos prioritarios para este ciudadano.</div>';
              return;
            }
            attentionList.innerHTML = items.map((item) => `
              <div class="attention-card ${escapeHtml(item.kind)}">
                <strong>${escapeHtml(item.title)}</strong>
                <span>${escapeHtml(item.text)}</span>
              </div>
            `).join("");
          }

          function renderTimeline(data) {
            const events = [];
            (data.expedientes || []).forEach((row) => addTimelineEvent(events, "expedientes", row, "Expediente"));
            (data.notificaciones || []).forEach((row) => addTimelineEvent(events, "notificaciones", row, "Notificación"));
            (data.pagos || []).forEach((row) => addTimelineEvent(events, "pagos", row, "Pago"));
            (data.citas || []).forEach((row) => addTimelineEvent(events, "citas", row, "Cita"));
            (data.personas || []).forEach((row) => addTimelineEvent(events, "personas", row, "Datos personales"));
            const sorted = events.sort((a, b) => b.date - a.date).slice(0, 12);
            if (!sorted.length) {
              timelineList.innerHTML = '<div class="empty">No hay eventos para este ciudadano.</div>';
              return;
            }
            timelineList.innerHTML = sorted.map((event) => `
              <div class="timeline-card">
                <div class="timeline-date">${escapeHtml(formatDate(event.date))}</div>
                <div>
                  <strong>${escapeHtml(event.title)}</strong>
                  <span>${escapeHtml(event.subtitle)}</span>
                  <span>${escapeHtml(event.related)}</span>
                </div>
              </div>
            `).join("");
          }

          async function loadCitizenOverview(existingToken = null) {
            const tokenJson = existingToken || await getToken();
            const citizenId = selectedCitizenId();
            const entries = await Promise.all(Object.entries(citizenFolders).map(async ([folder, meta]) => {
              const query = `${meta.endpoint}?select=*&${meta.filterKey}=eq.${encodeURIComponent(citizenId)}&order=fecha.desc.nullslast&limit=50`;
              const rows = await fetchCitizenEndpoint(tokenJson, query);
              return [folder, rows];
            }));
            citizenFolderData = Object.fromEntries(entries);
            Object.entries(citizenFolderData).forEach(([folder, rows]) => {
              const button = citizenFolderList.querySelector(`[data-folder="${folder}"]`);
              if (button) button.dataset.total = String(rows.length);
            });
            renderCitizenFolderButtons();
            citizenRows = citizenFolderData[activeCitizenFolder] || [];
            renderCitizenDataTable(citizenRows);
            renderExternalExpedientesAsMain(citizenFolderData.expedientes || []);
            renderAttention(citizenFolderData);
            renderTimeline(citizenFolderData);
          }

          function applyPreset(name) {
            form.reset();
            form.limit.value = "10";
            form.citizenFilter.value = "CIT-10001";
            if (name === "pending") form.statusFilter.value = "pendiente_documentacion";
            if (name === "resolved") form.statusFilter.value = "resuelto";
            if (name === "recent") form.limit.value = "5";
            if (name === "empty") form.codeFilter.value = "EXP-SIN-RESULTADOS";
            runQuery(name !== "all" && name !== "recent" ? true : false);
          }

          function resetQueryView() {
            form.reset();
            form.statusFilter.value = "";
            form.titleFilter.value = "";
            form.codeFilter.value = "";
            form.citizenFilter.value = "CIT-10001";
            form.dateFrom.value = "";
            form.dateTo.value = "";
            form.limit.value = "10";
            lastRows = [];
            lastPayload = null;
            lastRequestBody = null;
            selectedIndex = null;
            citizenRows = [];
            citizenFolderData = {};
            activeCitizenFolder = "expedientes";
            renderSummary([]);
            renderCharts([]);
            renderDetail(null);
            renderCitizenFolderButtons();
            attentionList.innerHTML = '<div class="empty">Consulta un ciudadano para ver avisos.</div>';
            timelineList.innerHTML = '<div class="empty">Consulta un ciudadano para ver su línea de vida.</div>';
            tableWrap.innerHTML = '<div class="empty">Sin resultados todavía.</div>';
            citizenDataWrap.innerHTML = '<div class="empty">Sin carpeta cargada.</div>';
            citizenDataDetail.innerHTML = '<div class="empty">Selecciona una fila.</div>';
            citizenDataLabel.textContent = "Selecciona una carpeta para consultar datos externos relacionados.";
            resultLabel.textContent = "Ejecuta una consulta para ver resultados estructurados.";
            renderSession(session);
            setStatus("Vista restablecida.", "ok");
            applyLanguage(languageSelect.value);
          }

          form.addEventListener("submit", (event) => {
            event.preventDefault();
            runQuery(false);
          });
          resetQueryButton.addEventListener("click", resetQueryView);

          initCollapsiblePanels();

          citizenFolderList.addEventListener("click", (event) => {
            const button = event.target.closest("[data-folder]");
            if (!button) return;
            activeCitizenFolder = button.dataset.folder;
            renderCitizenFolderButtons();
            loadCitizenData()
              .then(() => setStatus(`Carpeta cargada: ${citizenFolders[activeCitizenFolder].title}.`, "ok"))
              .catch((error) => setStatus(error.message || String(error), "bad"));
          });

          citizenRefreshButton.addEventListener("click", () => {
            loadCitizenOverview()
              .then(() => setStatus("Vista ciudadana actualizada.", "ok"))
              .catch((error) => setStatus(error.message || String(error), "bad"));
          });

          citizenDataWrap.addEventListener("click", (event) => {
            const row = event.target.closest("tr[data-citizen-index]");
            if (!row) return;
            citizenDataWrap.querySelectorAll("tr.selected").forEach((node) => node.classList.remove("selected"));
            row.classList.add("selected");
            renderCitizenDataDetail(citizenRows[Number(row.dataset.citizenIndex)]);
          });

          tableWrap.addEventListener("click", (event) => {
            const row = event.target.closest("tr[data-index]");
            if (!row) return;
            selectedIndex = Number(row.dataset.index);
            tableWrap.querySelectorAll("tr.selected").forEach((node) => node.classList.remove("selected"));
            row.classList.add("selected");
            renderDetail(lastRows[selectedIndex]);
          });

          tableWrap.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            const row = event.target.closest("tr[data-index]");
            if (!row) return;
            event.preventDefault();
            row.click();
          });

          document.querySelectorAll("[data-preset]").forEach((button) => {
            button.addEventListener("click", () => applyPreset(button.dataset.preset));
          });

          refreshSessionButton.addEventListener("click", () => {
            clearLocalSession();
            getToken()
              .then(() => setStatus("Sesión renovada.", "ok"))
              .catch((error) => setStatus(error.message || String(error), "bad"));
          });

          logoutButton.addEventListener("click", () => {
            const idToken = session?.id_token;
            clearLocalSession();
            renderSession(null);
            setStatus("Sesión cerrada.", "warn");
            const params = new URLSearchParams({
              client_id: oidc.clientId,
              post_logout_redirect_uri: oidc.redirectUri
            });
            if (idToken) params.set("id_token_hint", idToken);
            window.location.assign(`${oidc.logoutUrl}?${params}`);
          });

          languageSelect.value = localStorage.getItem("denaClientLanguage") || "es";
          applyTheme(localStorage.getItem("denaClientTheme") || "light");
          applyLanguage(languageSelect.value);
          languageSelect.addEventListener("change", () => applyLanguage(languageSelect.value));
          themeToggle.addEventListener("click", () => {
            applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
          });

          handleAuthCallback()
            .then((handled) => {
              const params = new URLSearchParams(window.location.search);
              if (!handled && params.get("autoload") === "1") runQuery(false);
            })
            .catch((error) => setStatus(error.message || String(error), "bad"))
            .finally(() => renderSession(session));
          renderCharts([]);
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dena-interop-spa
  namespace: app
  labels:
    app: dena-interop-spa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dena-interop-spa
  template:
    metadata:
      labels:
        app: dena-interop-spa
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: dena-interop-spa
---
apiVersion: v1
kind: Service
metadata:
  name: dena-interop-spa
  namespace: app
  labels:
    app: dena-interop-spa
spec:
  type: ClusterIP
  selector:
    app: dena-interop-spa
  ports:
    - name: http
      port: 80
      targetPort: http
