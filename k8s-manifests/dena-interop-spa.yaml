apiVersion: v1
kind: ConfigMap
metadata:
  name: dena-interop-spa
  namespace: app
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DENA Interop · Cliente demo</title>
        <style>
          :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --ink: #17212b;
            --muted: #5d6a76;
            --line: #d9e0e7;
            --brand: #12615f;
            --brand-dark: #0b4646;
            --brand-soft: #e4f2f1;
            --ok: #137547;
            --warn: #9a6700;
            --closed: #4f5d75;
            --bad: #a13d3d;
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
          }
          main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 42px;
          }
          .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
          }
          .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
          }
          .mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            background: var(--brand);
            color: white;
            font-weight: 800;
          }
          h1 {
            margin: 0;
            font-size: 1.35rem;
            line-height: 1.1;
          }
          .subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: .92rem;
          }
          .status {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 12px;
            background: var(--surface);
            color: var(--muted);
            font-size: .92rem;
            white-space: nowrap;
          }
          .status.ok { color: var(--ok); border-color: #b8ddc8; background: #eef9f2; }
          .status.bad { color: var(--bad); border-color: #ecc6c6; background: #fff1f1; }
          .workspace {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
          }
          .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 10px 28px rgba(18, 32, 44, .06);
          }
          .panel-head {
            border-bottom: 1px solid var(--line);
            padding: 16px 18px;
          }
          .panel-head h2 {
            margin: 0;
            font-size: 1rem;
          }
          .panel-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: .9rem;
            line-height: 1.4;
          }
          form {
            padding: 4px 18px 18px;
          }
          label {
            display: block;
            margin: 14px 0 6px;
            color: var(--muted);
            font-size: .86rem;
            font-weight: 650;
          }
          input, select, button {
            width: 100%;
            min-height: 42px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font: inherit;
            padding: 10px 11px;
          }
          input, select { background: #fff; color: var(--ink); }
          button {
            margin-top: 18px;
            border: 0;
            background: var(--brand);
            color: white;
            cursor: pointer;
            font-weight: 700;
          }
          button:hover { background: var(--brand-dark); }
          button:disabled {
            cursor: wait;
            opacity: .7;
          }
          .flow {
            padding: 0 18px 18px;
            display: grid;
            gap: 10px;
          }
          .flow-step {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: .9rem;
          }
          .flow-step span {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            font-weight: 800;
            font-size: .8rem;
          }
          .results {
            min-width: 0;
          }
          .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
          }
          .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            padding: 14px;
          }
          .metric span {
            display: block;
            color: var(--muted);
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
          }
          .metric strong {
            display: block;
            margin-top: 6px;
            font-size: 1.5rem;
          }
          .table-wrap {
            overflow: auto;
          }
          table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
          }
          th, td {
            border-bottom: 1px solid var(--line);
            padding: 12px 14px;
            text-align: left;
            vertical-align: top;
          }
          th {
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .02em;
          }
          tbody tr:hover {
            background: #fbfdff;
          }
          .code {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .86rem;
          }
          .title-cell {
            max-width: 320px;
            font-weight: 700;
          }
          .title-cell small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 500;
          }
          .badge {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            border-radius: 999px;
            padding: 4px 9px;
            background: #eef2f6;
            color: var(--closed);
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
          }
          .badge.abierto { background: #e8f6ef; color: var(--ok); }
          .badge.en_tramitacion { background: #e6f0ff; color: #245ca8; }
          .badge.pendiente_documentacion { background: #fff5d8; color: var(--warn); }
          .badge.resuelto { background: #edf7e8; color: #4c7a1f; }
          .empty {
            padding: 42px 18px;
            text-align: center;
            color: var(--muted);
          }
          details {
            border-top: 1px solid var(--line);
          }
          summary {
            cursor: pointer;
            padding: 14px 18px;
            color: var(--muted);
            font-weight: 700;
          }
          pre {
            overflow: auto;
            max-height: 320px;
            margin: 0;
            padding: 16px 18px 18px;
            background: #13221c;
            color: #eef8ed;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .9rem;
          }
          @media (max-width: 760px) {
            .topbar { align-items: stretch; flex-direction: column; }
            .status { justify-content: flex-start; white-space: normal; }
            .workspace { grid-template-columns: 1fr; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
        </style>
      </head>
      <body>
        <main>
          <header class="topbar">
            <div class="brand">
              <div class="mark">D</div>
              <div>
                <h1>DENA Interop</h1>
                <p class="subtitle">Consulta demo de expedientes federados por OIDC</p>
              </div>
            </div>
            <div class="status" id="status">Listo para autenticar.</div>
          </header>

          <section class="workspace">
            <aside class="panel">
              <div class="panel-head">
                <h2>Parámetros</h2>
                <p>La consulta obtiene token en Keycloak y llama a la RPC DENA mediante APISIX.</p>
              </div>
              <form id="login">
                <label for="username">Usuario</label>
                <input id="username" name="username" value="testuser" autocomplete="username">
                <label for="password">Password</label>
                <input id="password" name="password" value="Test1234!" type="password" autocomplete="current-password">
                <label for="statusFilter">Estado</label>
                <select id="statusFilter" name="statusFilter">
                  <option value="">Todos</option>
                  <option value="abierto">Abierto</option>
                  <option value="en_tramitacion">En tramitación</option>
                  <option value="pendiente_documentacion">Pendiente documentación</option>
                  <option value="resuelto">Resuelto</option>
                  <option value="archivado">Archivado</option>
                </select>
                <label for="limit">Expedientes a consultar</label>
                <input id="limit" name="limit" value="10" type="number" min="1" max="50">
                <button id="submitButton" type="submit">Consultar expedientes</button>
              </form>
              <div class="flow">
                <div class="flow-step"><span>1</span><strong>Token OIDC</strong></div>
                <div class="flow-step"><span>2</span><strong>Validación APISIX</strong></div>
                <div class="flow-step"><span>3</span><strong>RPC PostgREST</strong></div>
              </div>
            </aside>

            <section class="results">
              <div class="summary" id="summary">
                <div class="metric"><span>Expedientes</span><strong>0</strong></div>
                <div class="metric"><span>Importe total</span><strong>0 €</strong></div>
                <div class="metric"><span>Última actualización</span><strong>-</strong></div>
                <div class="metric"><span>Sistemas origen</span><strong>0</strong></div>
              </div>
              <div class="panel">
                <div class="panel-head">
                  <h2>Expedientes</h2>
                  <p id="resultLabel">Ejecuta una consulta para ver resultados estructurados.</p>
                </div>
                <div class="table-wrap" id="tableWrap">
                  <div class="empty">Sin resultados todavía.</div>
                </div>
                <details>
                  <summary>Ver respuesta JSON</summary>
                  <pre id="output">Sin resultados todavía.</pre>
                </details>
              </div>
            </section>
          </section>
        </main>
        <script>
          const statusEl = document.querySelector("#status");
          const outputEl = document.querySelector("#output");
          const summaryEl = document.querySelector("#summary");
          const tableWrap = document.querySelector("#tableWrap");
          const resultLabel = document.querySelector("#resultLabel");
          const form = document.querySelector("#login");
          const submitButton = document.querySelector("#submitButton");

          const statusLabels = {
            abierto: "Abierto",
            en_tramitacion: "En tramitación",
            pendiente_documentacion: "Pendiente documentación",
            resuelto: "Resuelto",
            archivado: "Archivado"
          };

          const currency = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
          const shortDate = new Intl.DateTimeFormat("es-ES", { dateStyle: "medium" });

          function setStatus(message, kind = "") {
            statusEl.textContent = message;
            statusEl.className = `status ${kind}`;
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? value : shortDate.format(date);
          }

          function formatStatus(value) {
            const label = statusLabels[value] || value || "Sin estado";
            return `<span class="badge ${escapeHtml(value)}">${escapeHtml(label)}</span>`;
          }

          function renderSummary(rows) {
            const totalAmount = rows.reduce((sum, row) => sum + Number(row.amount_eur || 0), 0);
            const latest = rows
              .map((row) => new Date(row.updated_at))
              .filter((date) => !Number.isNaN(date.getTime()))
              .sort((a, b) => b - a)[0];
            const sources = new Set(rows.map((row) => row.source_system).filter(Boolean));
            summaryEl.innerHTML = `
              <div class="metric"><span>Expedientes</span><strong>${rows.length}</strong></div>
              <div class="metric"><span>Importe total</span><strong>${currency.format(totalAmount)}</strong></div>
              <div class="metric"><span>Última actualización</span><strong>${latest ? shortDate.format(latest) : "-"}</strong></div>
              <div class="metric"><span>Sistemas origen</span><strong>${sources.size}</strong></div>
            `;
          }

          function renderTable(rows) {
            if (!rows.length) {
              tableWrap.innerHTML = '<div class="empty">La consulta no devolvió expedientes.</div>';
              resultLabel.textContent = "No hay expedientes para los filtros seleccionados.";
              return;
            }
            resultLabel.textContent = `${rows.length} expedientes recuperados desde la API DENA.`;
            tableWrap.innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>Expediente</th>
                    <th>Título</th>
                    <th>Estado</th>
                    <th>Importe</th>
                    <th>Apertura</th>
                    <th>Actualizado</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((row) => `
                    <tr>
                      <td class="code">${escapeHtml(row.expediente_code || row.id)}</td>
                      <td class="title-cell">
                        ${escapeHtml(row.title)}
                        <small>${escapeHtml(row.citizen_id)} · ${escapeHtml(row.source_system)}</small>
                      </td>
                      <td>${formatStatus(row.status)}</td>
                      <td>${currency.format(Number(row.amount_eur || 0))}</td>
                      <td>${formatDate(row.opened_at)}</td>
                      <td>${formatDate(row.updated_at)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;
          }

          function renderPayload(payload) {
            const rows = Array.isArray(payload) ? payload : [];
            renderSummary(rows);
            renderTable(rows);
            outputEl.textContent = JSON.stringify(payload, null, 2);
          }

          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            setStatus("Solicitando token...");
            outputEl.textContent = "Esperando respuesta...";
            submitButton.disabled = true;
            const data = new FormData(form);
            try {
              const tokenResponse = await fetch("/realms/piloto/protocol/openid-connect/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                  client_id: "react-frontend",
                  grant_type: "password",
                  username: data.get("username"),
                  password: data.get("password"),
                  scope: "openid"
                })
              });
              if (!tokenResponse.ok) {
                throw new Error(`Token HTTP ${tokenResponse.status}`);
              }
              const tokenJson = await tokenResponse.json();
              setStatus("Token emitido. Consultando API...");
              const requestBody = { p_limit: Number(data.get("limit") || 10) };
              if (data.get("statusFilter")) {
                requestBody.p_status = data.get("statusFilter");
              }
              const apiResponse = await fetch("/dena/admin-files", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${tokenJson.access_token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
              });
              if (!apiResponse.ok) {
                  throw new Error(`API HTTP ${apiResponse.status}`);
              }
              const payload = await apiResponse.json();
              renderPayload(payload);
              setStatus(`Consulta correcta: ${Array.isArray(payload) ? payload.length : 0} expedientes.`, "ok");
            } catch (error) {
              outputEl.textContent = String(error);
              tableWrap.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              resultLabel.textContent = "No se pudo completar la consulta.";
              setStatus("La consulta ha fallado.", "bad");
            } finally {
              submitButton.disabled = false;
            }
          });
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dena-interop-spa
  namespace: app
  labels:
    app: dena-interop-spa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dena-interop-spa
  template:
    metadata:
      labels:
        app: dena-interop-spa
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: dena-interop-spa
---
apiVersion: v1
kind: Service
metadata:
  name: dena-interop-spa
  namespace: app
  labels:
    app: dena-interop-spa
spec:
  type: ClusterIP
  selector:
    app: dena-interop-spa
  ports:
    - name: http
      port: 80
      targetPort: http
