apiVersion: v1
kind: ConfigMap
metadata:
  name: dena-interop-spa
  namespace: app
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DENA Interop · Cliente demo</title>
        <style>
          :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --ink: #17212b;
            --muted: #5d6a76;
            --line: #d9e0e7;
            --brand: #12615f;
            --brand-dark: #0b4646;
            --brand-soft: #e4f2f1;
            --ok: #137547;
            --warn: #9a6700;
            --closed: #4f5d75;
            --bad: #a13d3d;
            --blue: #245ca8;
          }
          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #101820;
            --surface: #17212b;
            --surface-soft: #1e2a35;
            --ink: #edf4f7;
            --muted: #a9b8c6;
            --line: #344352;
            --brand: #6fb3d2;
            --brand-dark: #8fc6dc;
            --brand-soft: #203948;
            --ok: #74d39a;
            --warn: #f2c96d;
            --closed: #b6c2d1;
            --bad: #f09a9a;
            --blue: #9ec5ff;
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
          }
          main {
            width: min(1380px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 38px;
          }
          .topbar, .brand, .session-actions, .panel-title, .detail-head, .topbar-tools {
            display: flex;
            align-items: center;
          }
          .topbar {
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
          }
          .brand {
            gap: 12px;
            min-width: 0;
          }
          .mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            background: var(--brand);
            color: white;
            font-weight: 800;
          }
          h1 {
            margin: 0;
            font-size: 1.35rem;
            line-height: 1.1;
          }
          .subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: .92rem;
          }
          .topbar-tools {
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
          }
          .locale-select, .theme-toggle {
            min-height: 38px;
            width: auto;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-size: .86rem;
          }
          .theme-toggle { padding: 8px 10px; }
          .status {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 12px;
            background: var(--surface);
            color: var(--muted);
            font-size: .92rem;
            white-space: nowrap;
          }
          .status.ok { color: var(--ok); border-color: #b8ddc8; background: #eef9f2; }
          .status.bad { color: var(--bad); border-color: #ecc6c6; background: #fff1f1; }
          .status.warn { color: var(--warn); border-color: #f3d38b; background: #fff8e6; }
          .workspace {
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
          }
          .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 10px 28px rgba(18, 32, 44, .06);
          }
          .panel + .panel { margin-top: 14px; }
          .panel-head {
            border-bottom: 1px solid var(--line);
            padding: 16px 18px;
          }
          .panel.collapsed .panel-head { border-bottom: 0; }
          .panel-head h2, .panel-title h2 {
            margin: 0;
            font-size: 1rem;
          }
          .panel-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: .9rem;
            line-height: 1.4;
          }
          .panel-title {
            justify-content: space-between;
            gap: 12px;
          }
          .panel-controls {
            display: inline-flex;
            align-items: center;
            gap: 6px;
          }
          .panel-toggle, .panel-help {
            min-height: 32px;
            width: 36px;
            padding: 0;
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            font-size: 1rem;
          }
          .panel-help {
            border-style: dashed;
            font-weight: 850;
          }
          .panel-toggle:hover, .panel-help:hover {
            background: var(--surface-soft);
          }
          .panel.collapsed [data-panel-body] {
            display: none;
          }
          .panel-content-collapsed {
            display: none !important;
          }
          form {
            padding: 4px 18px 18px;
          }
          label {
            display: block;
            margin: 14px 0 6px;
            color: var(--muted);
            font-size: .86rem;
            font-weight: 650;
          }
          input, select, button {
            min-height: 40px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font: inherit;
            padding: 9px 11px;
          }
          input, select {
            width: 100%;
            background: var(--surface);
            color: var(--ink);
          }
          button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--brand);
            color: white;
            cursor: pointer;
            font-weight: 700;
          }
          button:hover { background: var(--brand-dark); }
          button:disabled {
            cursor: wait;
            opacity: .7;
          }
          .button-secondary {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
          }
          .button-secondary:hover {
            background: var(--surface-soft);
          }
          .button-danger {
            background: #fff1f1;
            color: var(--bad);
            border: 1px solid #ecc6c6;
          }
          .button-danger:hover {
            background: #ffe5e5;
          }
          .submit-button {
            width: 100%;
            margin-top: 18px;
            border: 0;
          }
          .form-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: end;
          }
          .form-actions .submit-button {
            margin-top: 18px;
          }
          .form-actions .button-secondary {
            min-width: 104px;
            margin-top: 18px;
          }
          .session-actions button {
            width: auto;
          }
          .presets {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 14px 18px 18px;
          }
          .presets button {
            width: 100%;
            min-height: 36px;
            padding: 7px 9px;
            font-size: .86rem;
          }
          .folder-list {
            display: grid;
            gap: 8px;
            padding: 14px 18px 18px;
          }
          .folder-button {
            width: 100%;
            justify-content: space-between;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
          }
          .folder-button:hover {
            background: var(--surface-soft);
          }
          .folder-button.active {
            border-color: var(--brand);
            background: var(--brand-soft);
          }
          .folder-button span {
            color: var(--muted);
            font-size: .78rem;
          }
          .session-card {
            padding: 14px 18px 18px;
          }
          .session-grid, .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
          }
          .session-item, .detail-item {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
            padding: 10px;
          }
          .session-item span, .detail-item span {
            display: block;
            color: var(--muted);
            font-size: .76rem;
            font-weight: 800;
            text-transform: uppercase;
          }
          .session-item strong, .detail-item strong {
            display: block;
            margin-top: 4px;
            overflow-wrap: anywhere;
            font-size: .92rem;
          }
          .session-actions {
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
          }
          .results {
            min-width: 0;
          }
          .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
          }
          .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            padding: 14px;
          }
          .metric span {
            display: block;
            color: var(--muted);
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
          }
          .metric strong {
            display: block;
            margin-top: 6px;
            font-size: 1.5rem;
          }
          .visuals {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
            margin-bottom: 14px;
          }
          .bars {
            display: grid;
            gap: 11px;
            padding: 14px 18px 18px;
          }
          .bar-row {
            display: grid;
            grid-template-columns: 145px minmax(0, 1fr) 44px;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: .86rem;
          }
          .bar-track {
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: #e8edf2;
          }
          .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--brand);
          }
          .bar-fill.amount { background: var(--blue); }
          .table-wrap {
            overflow: auto;
          }
          table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
          }
          th, td {
            border-bottom: 1px solid var(--line);
            padding: 12px 14px;
            text-align: left;
            vertical-align: top;
          }
          th {
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .02em;
          }
          tbody tr {
            cursor: pointer;
          }
          tbody tr:hover, tbody tr.selected {
            background: var(--surface-soft);
          }
          tbody tr.selected td:first-child {
            box-shadow: inset 3px 0 0 var(--brand);
          }
          .code {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .86rem;
          }
          .title-cell {
            max-width: 320px;
            font-weight: 700;
          }
          .title-cell small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 500;
          }
          .badge {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            border-radius: 999px;
            padding: 4px 9px;
            background: var(--surface-soft);
            color: var(--closed);
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
          }
          .badge.abierto { background: #e8f6ef; color: var(--ok); }
          .badge.en_tramitacion { background: #e6f0ff; color: var(--blue); }
          .badge.pendiente_documentacion { background: #fff5d8; color: var(--warn); }
          .badge.resuelto { background: #edf7e8; color: #4c7a1f; }
          .empty {
            padding: 42px 18px;
            text-align: center;
            color: var(--muted);
          }
          .detail {
            border-top: 1px solid var(--line);
            padding: 16px 18px 18px;
          }
          .citizen-data-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 14px;
            align-items: start;
          }
          .citizen-data-detail {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
            padding: 12px;
          }
          .citizen-data-detail pre {
            max-height: 260px;
            overflow: auto;
            margin: 10px 0 0;
            padding: 12px;
            border-radius: 8px;
            background: #13202b;
            color: #eef6ff;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .8rem;
          }
          .citizen-overview {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 14px;
            margin-bottom: 14px;
          }
          .attention-list, .timeline-list {
            display: grid;
            gap: 10px;
            padding: 14px 18px 18px;
          }
          .attention-card, .timeline-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
            padding: 11px;
          }
          .attention-card.warn {
            border-color: #f3d38b;
            background: #fff8e6;
            color: #3f2f00;
          }
          .attention-card.bad {
            border-color: #ecc6c6;
            background: #fff1f1;
            color: #5d1f1f;
          }
          .attention-card strong, .timeline-card strong {
            display: block;
            font-size: .92rem;
          }
          .attention-card span, .timeline-card span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: .84rem;
            line-height: 1.35;
          }
          .attention-card.warn span { color: #6d5200; }
          .attention-card.bad span { color: #7c3333; }
          .timeline-card {
            display: grid;
            grid-template-columns: 94px minmax(0, 1fr);
            gap: 12px;
          }
          .timeline-date {
            color: var(--muted);
            font-size: .78rem;
            font-weight: 800;
            text-transform: uppercase;
          }
          .detail-head {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
          }
          .detail-head h3 {
            margin: 0;
            font-size: 1rem;
          }
          .detail-json {
            margin-top: 12px;
          }
          .citizen-guide {
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
            padding: 12px;
          }
          .citizen-guide h4 {
            margin: 0 0 7px;
            font-size: .96rem;
          }
          .citizen-guide p {
            margin: 6px 0;
            color: var(--muted);
            line-height: 1.45;
            font-size: .9rem;
          }
          .citizen-guide ul {
            margin: 8px 0 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.45;
            font-size: .88rem;
          }
          .notice {
            margin-top: 10px;
            border-radius: 8px;
            padding: 10px;
            font-size: .9rem;
            background: #eef9f2;
            color: var(--ok);
            border: 1px solid #b8ddc8;
          }
          .notice.warn {
            background: #fff8e6;
            color: var(--warn);
            border-color: #f3d38b;
          }
          @media (max-width: 980px) {
            .workspace, .visuals, .citizen-data-grid, .citizen-overview { grid-template-columns: 1fr; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          @media (max-width: 640px) {
            main { width: min(100% - 20px, 1380px); padding-top: 14px; }
            .topbar { align-items: stretch; flex-direction: column; }
            .topbar-tools { justify-content: stretch; }
            .locale-select, .theme-toggle, .topbar-tools .status { width: 100%; }
            .status { justify-content: flex-start; white-space: normal; }
            .summary, .session-grid, .detail-grid, .presets { grid-template-columns: 1fr; }
            .bar-row { grid-template-columns: 1fr; gap: 5px; }
            .table-wrap { overflow: visible; }
            table, thead, tbody, tr, td { display: block; min-width: 0; }
            thead { display: none; }
            tbody tr {
              margin: 12px;
              border: 1px solid var(--line);
              border-radius: 8px;
              background: var(--surface);
            }
            tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
            td {
              display: grid;
              grid-template-columns: 112px minmax(0, 1fr);
              gap: 10px;
              padding: 10px 12px;
            }
            td::before {
              content: attr(data-label);
              color: var(--muted);
              font-size: .76rem;
              font-weight: 800;
              text-transform: uppercase;
            }
          }
        </style>
      </head>
      <body>
        <main>
          <header class="topbar">
            <div class="brand">
              <div class="mark">D</div>
              <div>
                <h1>DENA Interop</h1>
                <p class="subtitle">Consulta ciudadana de expedientes</p>
              </div>
            </div>
            <div class="topbar-tools">
              <select class="locale-select" id="languageSelect" aria-label="Idioma">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="eu">Euskara</option>
              </select>
              <button class="theme-toggle button-secondary" id="themeToggle" type="button">Oscuro</button>
              <div class="status" id="status">Listo para iniciar sesión.</div>
            </div>
          </header>

          <section class="workspace">
            <aside>
              <section class="panel">
                <div class="panel-head">
                  <h2>Consulta</h2>
                  <p>Inicia sesión y filtra los expedientes que quieres revisar.</p>
                </div>
                <form id="login">
                  <div class="empty">La autenticación se realiza en Keycloak. Usa testuser / Test1234! cuando se abra la pantalla de login.</div>
                  <label for="statusFilter">Estado</label>
                  <select id="statusFilter" name="statusFilter">
                    <option value="">Todos</option>
                    <option value="abierto">Abierto</option>
                    <option value="en_tramitacion">En tramitación</option>
                    <option value="pendiente_documentacion">Pendiente documentación</option>
                    <option value="resuelto">Resuelto</option>
                    <option value="archivado">Archivado</option>
                  </select>
                  <label for="titleFilter">Título</label>
                  <input id="titleFilter" name="titleFilter" placeholder="Buscar en el título">
                  <label for="codeFilter">Número de expediente</label>
                  <input id="codeFilter" name="codeFilter" placeholder="Ej. EXP-0001">
                  <label for="citizenFilter">Identificador ciudadano</label>
                  <input id="citizenFilter" name="citizenFilter" value="CIT-10001" placeholder="Ej. CIT-10001">
                  <label for="dateFrom">Fecha desde</label>
                  <input id="dateFrom" name="dateFrom" type="date">
                  <label for="dateTo">Fecha hasta</label>
                  <input id="dateTo" name="dateTo" type="date">
                  <label for="limit">Expedientes a consultar</label>
                  <input id="limit" name="limit" value="10" type="number" min="1" max="50">
                  <div class="form-actions">
                    <button class="submit-button" id="submitButton" type="submit">Consultar expedientes</button>
                    <button class="button-secondary" id="resetQueryButton" type="button">Resetear</button>
                  </div>
                </form>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Filtros rápidos</h2>
                  <p>Accesos directos para consultar los casos más habituales.</p>
                </div>
                <div class="presets">
                  <button class="button-secondary" type="button" data-preset="all">Todos</button>
                  <button class="button-secondary" type="button" data-preset="pending">Pendientes</button>
                  <button class="button-secondary" type="button" data-preset="resolved">Resueltos</button>
                  <button class="button-secondary" type="button" data-preset="recent">Últimos</button>
                  <button class="button-secondary" type="button" data-preset="empty">Sin resultados</button>
                </div>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Mis carpetas</h2>
                  <p>Datos relacionados con el ciudadano seleccionado.</p>
                </div>
                <div class="folder-list" id="citizenFolderList">
                  <button class="folder-button active" type="button" data-folder="expedientes">Mis expedientes <span>-</span></button>
                  <button class="folder-button" type="button" data-folder="notificaciones">Notificaciones <span>-</span></button>
                  <button class="folder-button" type="button" data-folder="pagos">Pagos <span>-</span></button>
                  <button class="folder-button" type="button" data-folder="citas">Citas <span>-</span></button>
                  <button class="folder-button" type="button" data-folder="personas">Datos personales <span>-</span></button>
                </div>
              </section>

              <section class="panel" id="sessionPanel">
                <div class="panel-head">
                  <h2>Sesión</h2>
                  <p id="sessionLabel">Aún no hay token emitido.</p>
                </div>
                <div class="session-card">
                  <div class="session-grid" id="sessionGrid">
                    <div class="session-item"><span>Usuario</span><strong>-</strong></div>
                    <div class="session-item"><span>Expira</span><strong>-</strong></div>
                    <div class="session-item"><span>Estado</span><strong>Sin iniciar</strong></div>
                    <div class="session-item"><span>Consulta</span><strong>-</strong></div>
                  </div>
                  <div class="session-actions">
                    <button class="button-secondary" id="refreshSessionButton" type="button">Renovar</button>
                    <button class="button-danger" id="logoutButton" type="button">Cerrar sesión</button>
                  </div>
                </div>
              </section>
            </aside>

            <section class="results">
              <div class="summary" id="summary">
                <div class="metric"><span>Expedientes</span><strong>0</strong></div>
                <div class="metric"><span>Importe total</span><strong>0 €</strong></div>
                <div class="metric"><span>Última actualización</span><strong>-</strong></div>
                <div class="metric"><span>Organismos</span><strong>0</strong></div>
              </div>
              <div class="citizen-overview">
                <section class="panel" data-collapsible>
                  <div class="panel-head">
                    <div class="panel-title">
                      <h2>Requiere mi atención</h2>
                      <button class="panel-toggle" type="button" aria-label="Plegar Requiere mi atención" aria-expanded="true">⌃</button>
                    </div>
                    <p>Pagos, notificaciones, citas o expedientes que necesitan revisión.</p>
                  </div>
                  <div class="attention-list" id="attentionList" data-panel-body>
                    <div class="empty">Consulta un ciudadano para ver avisos.</div>
                  </div>
                </section>
                <section class="panel" data-collapsible>
                  <div class="panel-head">
                    <div class="panel-title">
                      <h2>Línea de vida</h2>
                      <button class="panel-toggle" type="button" aria-label="Plegar Línea de vida" aria-expanded="true">⌃</button>
                    </div>
                    <p>Actividad consolidada de expedientes, notificaciones, pagos, citas y datos personales.</p>
                  </div>
                  <div class="timeline-list" id="timelineList" data-panel-body>
