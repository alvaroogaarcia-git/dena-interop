apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: datalake
  labels:
    app: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v13.0.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgrest-secret
                  key: db-uri
            - name: PGRST_DB_ANON_ROLE
              value: anon
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_DB_SCHEMAS
              value: public
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: http://192.168.56.15:30080/api
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: datalake
  labels:
    app: postgrest
spec:
  type: ClusterIP
  selector:
    app: postgrest
  ports:
    - name: http
      port: 3000
      targetPort: http
