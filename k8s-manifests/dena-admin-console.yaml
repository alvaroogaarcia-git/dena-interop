apiVersion: v1
kind: ConfigMap
metadata:
  name: dena-admin-console
  namespace: app
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DENA · Consola admin</title>
        <style>
          :root {
            color-scheme: light;
            --bg: #f3f5f7;
            --surface: #fff;
            --soft: #f8fafc;
            --ink: #16212c;
            --muted: #617080;
            --line: #d9e1e8;
            --brand: #234b6d;
            --brand-soft: #e6eef5;
            --ok: #147247;
            --warn: #9a6700;
            --bad: #a13d3d;
            --blue: #245ca8;
          }
          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #101820;
            --surface: #17212b;
            --soft: #1e2a35;
            --ink: #edf4f7;
            --muted: #a9b8c6;
            --line: #344352;
            --brand: #6fb3d2;
            --brand-soft: #203948;
            --ok: #74d39a;
            --warn: #f2c96d;
            --bad: #f09a9a;
            --blue: #9ec5ff;
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
          }
          main {
            width: min(1440px, calc(100% - 32px));
            margin: 0 auto;
            padding: 22px 0 34px;
          }
          .topbar, .brand, .toolbar, .panel-title, .trace-step, .health-row, .actions, .topbar-tools, .panel-controls {
            display: flex;
            align-items: center;
          }
          .topbar {
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
          }
          .brand { gap: 12px; min-width: 0; }
          .mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            background: var(--brand);
            color: white;
            font-weight: 800;
          }
          h1 { margin: 0; font-size: 1.28rem; line-height: 1.1; }
          .subtitle { margin: 3px 0 0; color: var(--muted); font-size: .9rem; }
          .topbar-tools { justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
          .locale-select, .theme-toggle {
            min-height: 38px;
            width: auto;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-size: .86rem;
          }
          .theme-toggle { padding: 8px 10px; }
          .status {
            min-height: 38px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 12px;
            background: var(--surface);
            color: var(--muted);
            font-size: .9rem;
            white-space: nowrap;
          }
          .status.ok { color: var(--ok); border-color: #b8ddc8; background: #eef9f2; }
          .status.warn { color: var(--warn); border-color: #f3d38b; background: #fff8e6; }
          .status.bad { color: var(--bad); border-color: #ecc6c6; background: #fff1f1; }
          .layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr) 340px;
            gap: 14px;
            align-items: start;
          }
          .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(18, 32, 44, .05);
            overflow: hidden;
          }
          .panel + .panel { margin-top: 14px; }
          .panel-head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
          }
          .panel.collapsed .panel-head { border-bottom: 0; }
          .panel-title { justify-content: space-between; gap: 10px; }
          .panel-head h2 { margin: 0; font-size: 1rem; }
          .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: .86rem; line-height: 1.4; }
          form, .panel-body { padding: 14px 16px 16px; }
          .panel-controls {
            float: right;
            gap: 6px;
            margin-left: 10px;
          }
          .panel-toggle, .panel-help {
            min-width: 34px;
            min-height: 32px;
            padding: 5px 9px;
            border-color: var(--line);
            background: var(--surface);
            color: var(--muted);
            font-size: .9rem;
            line-height: 1;
          }
          .panel-help {
            border-style: dashed;
            font-weight: 850;
          }
          .panel-toggle:hover, .panel-help:hover { color: var(--ink); border-color: var(--brand); }
          .panel-content-collapsed { display: none !important; }
          label {
            display: block;
            margin: 12px 0 6px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 800;
            text-transform: uppercase;
          }
          input, select, button {
            min-height: 40px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font: inherit;
            padding: 9px 11px;
          }
          input, select { width: 100%; background: var(--surface); color: var(--ink); }
          button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--brand);
            color: white;
            cursor: pointer;
            font-weight: 750;
          }
          button:disabled { opacity: .65; cursor: wait; }
          .button-secondary { background: var(--surface); color: var(--ink); }
          .button-danger { background: #fff1f1; color: var(--bad); border-color: #ecc6c6; }
          .submit-button { width: 100%; margin-top: 16px; border: 0; }
          .actions { gap: 8px; flex-wrap: wrap; }
          .actions button { min-height: 36px; padding: 7px 10px; }
          .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
          .kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
          }
          .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            padding: 13px 14px;
          }
          .metric span { display: block; color: var(--muted); font-size: .78rem; font-weight: 800; text-transform: uppercase; }
          .metric strong { display: block; margin-top: 5px; font-size: 1.35rem; overflow-wrap: anywhere; }
          .toolbar { justify-content: space-between; gap: 10px; margin-bottom: 10px; }
          .toolbar input { max-width: 320px; }
          .table-wrap { overflow: auto; }
          table { width: 100%; border-collapse: collapse; min-width: 860px; }
          .external-table { min-width: 680px; }
          th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
          th {
            background: var(--soft);
            color: var(--muted);
            font-size: .76rem;
            text-transform: uppercase;
          }
          tbody tr { cursor: pointer; }
          tbody tr:hover, tbody tr.selected { background: var(--soft); }
          tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
          .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .86rem; }
          .muted { color: var(--muted); }
          .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
          }
          .badge.abierto { background: #e8f6ef; color: var(--ok); }
          .badge.en_tramitacion { background: #e6f0ff; color: var(--blue); }
          .badge.pendiente_documentacion { background: #fff5d8; color: var(--warn); }
          .badge.resuelto { background: #edf7e8; color: #4c7a1f; }
          .badge.archivado { background: #eef1f4; color: #4f5d75; }
          .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
          }
          .item {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            padding: 10px;
          }
          .item span { display: block; color: var(--muted); font-size: .75rem; font-weight: 800; text-transform: uppercase; }
          .item strong { display: block; margin-top: 4px; overflow-wrap: anywhere; font-size: .9rem; }
          .trace { display: grid; gap: 9px; }
          .trace-step { gap: 10px; }
          .dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: var(--ok);
            box-shadow: 0 0 0 4px #e8f6ef;
          }
          .trace-step strong { display: block; font-size: .9rem; }
          .trace-step span { display: block; color: var(--muted); font-size: .82rem; }
          .health-row {
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--line);
          }
          .health-row:last-child { border-bottom: 0; }
          .health-row strong { font-size: .9rem; }
          .health-row span { color: var(--muted); font-size: .82rem; }
          .stack-summary {
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
          }
          .stack-score {
            display: grid;
            min-height: 70px;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            font-size: 1.35rem;
            font-weight: 850;
          }
          .stack-score.ok { color: var(--ok); border-color: #b8ddc8; background: #eef9f2; }
          .stack-score.warn { color: var(--warn); border-color: #f3d38b; background: #fff8e6; }
          .stack-score.bad { color: var(--bad); border-color: #ecc6c6; background: #fff1f1; }
          .stack-copy strong { display: block; font-size: .95rem; }
          .stack-copy span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: .82rem;
            line-height: 1.35;
          }
          .health-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
          }
          .health-toolbar button { min-height: 34px; padding: 6px 9px; }
          .health-meta { color: var(--muted); font-size: .78rem; }
          .health-row.ok strong, .health-row.ok .health-state { color: var(--ok); }
          .health-row.warn strong, .health-row.warn .health-state { color: var(--warn); }
          .health-row.bad strong, .health-row.bad .health-state { color: var(--bad); }
          .health-row small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: .75rem;
            line-height: 1.3;
          }
          .flow-map {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
          }
          .flow-node {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            padding: 9px;
            text-align: center;
          }
          .flow-node strong {
            display: block;
            font-size: .78rem;
          }
          .flow-node span {
            display: block;
            margin-top: 3px;
            color: var(--ok);
            font-size: .72rem;
            font-weight: 800;
          }
          .timeline, .notifications, .compare-list, .permission-grid {
            display: grid;
            gap: 9px;
          }
          .timeline-item, .notification, .compare-row, .permission-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            padding: 10px;
          }
          .timeline-item strong, .notification strong, .compare-row strong, .permission-card strong {
            display: block;
            font-size: .9rem;
          }
          .timeline-item span, .notification span, .compare-row span, .permission-card span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: .82rem;
          }
          .compare-row.ok { border-color: #b8ddc8; background: #eef9f2; }
          .compare-row.warn { border-color: #f3d38b; background: #fff8e6; }
          .notification.warn { border-color: #f3d38b; background: #fff8e6; }
          .notification.ok { border-color: #b8ddc8; background: #eef9f2; }
          .notification.bad { border-color: #ecc6c6; background: #fff1f1; }
          .scenario-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
          }
          .scenario-buttons button {
            min-height: 36px;
            padding: 7px 9px;
            font-size: .84rem;
          }
          .folder-list {
            display: grid;
            gap: 8px;
          }
          .folder-button {
            width: 100%;
            justify-content: space-between;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
          }
          .folder-button.active {
            border-color: var(--brand);
            background: var(--brand-soft);
          }
          .folder-button span {
            color: var(--muted);
            font-size: .78rem;
          }
          .external-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            align-items: start;
          }
          .external-detail {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            padding: 12px;
          }
          .citizen360 {
            display: grid;
            gap: 14px;
          }
          .citizen360-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: end;
          }
          .citizen360-controls {
            display: grid;
            grid-template-columns: minmax(180px, 260px) auto auto;
            gap: 8px;
            align-items: end;
          }
          .citizen360-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
          }
          .citizen360-tabs button {
            min-height: 34px;
            padding: 7px 10px;
            background: var(--surface);
            color: var(--ink);
          }
          .citizen360-tabs button.active {
            border-color: var(--brand);
            background: var(--brand-soft);
          }
          .citizen360-summary {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
          }
          .citizen360 .metric strong { font-size: 1.2rem; }
          .citizen-preview {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--soft);
            padding: 12px;
            margin-top: 10px;
          }
          .citizen-preview h3 {
            margin: 0 0 7px;
            font-size: .98rem;
          }
          .citizen-preview p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: .86rem;
            line-height: 1.4;
          }
          pre {
            overflow: auto;
            max-height: 220px;
            margin: 0;
            padding: 12px;
            border-radius: 8px;
            background: #13202b;
            color: #eef6ff;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .8rem;
          }
          .empty { padding: 22px; text-align: center; color: var(--muted); }
          a { color: var(--brand); font-weight: 750; text-decoration: none; }
          @media (max-width: 1120px) {
            .layout { grid-template-columns: 320px minmax(0, 1fr); }
            .side-right { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
            .side-right .panel + .panel { margin-top: 0; }
            .flow-map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .external-grid { grid-template-columns: 1fr; }
          }
          @media (min-width: 1320px) {
            .external-grid { grid-template-columns: minmax(0, 1fr) minmax(300px, 340px); }
          }
          @media (max-width: 760px) {
            main { width: min(100% - 20px, 1440px); padding-top: 14px; }
            .topbar, .toolbar { align-items: stretch; flex-direction: column; }
            .topbar-tools { justify-content: stretch; }
            .locale-select, .theme-toggle, .topbar-tools .status { width: 100%; }
            .layout, .side-right, .kpis, .grid2, .detail-grid, .external-grid { grid-template-columns: 1fr; }
            .citizen360-head, .citizen360-controls, .citizen360-summary { grid-template-columns: 1fr; }
            .flow-map, .scenario-buttons { grid-template-columns: 1fr; }
            table { min-width: 720px; }
          }
        </style>
      </head>
      <body>
        <main>
          <header class="topbar">
            <div class="brand">
              <div class="mark">DA</div>
              <div>
                <h1>Centro de Control DENA</h1>
                <p class="subtitle">Consola administrativa de interoperabilidad y operación</p>
              </div>
            </div>
            <div class="topbar-tools">
              <select class="locale-select" id="languageSelect" aria-label="Idioma">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="eu">Euskara</option>
              </select>
              <button class="theme-toggle button-secondary" id="themeToggle" type="button">Oscuro</button>
              <div class="status" id="status">Listo para iniciar sesión.</div>
            </div>
          </header>

          <section class="layout">
            <aside>
              <section class="panel">
                <div class="panel-head">
                  <h2>Acceso admin</h2>
                  <p>La sesión se abre en Keycloak con MFA WebAuthn cuando corresponde.</p>
                </div>
                <form id="login">
                  <div class="grid2">
                    <div>
                      <label for="statusFilter">Estado</label>
                      <select id="statusFilter" name="statusFilter">
                        <option value="">Todos</option>
                        <option value="abierto">Abierto</option>
                        <option value="en_tramitacion">En tramitación</option>
                        <option value="pendiente_documentacion">Pendiente documentación</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="archivado">Archivado</option>
                      </select>
                    </div>
                    <div>
                      <label for="limit">Límite</label>
                      <input id="limit" name="limit" value="200" type="number" min="1" max="1000">
                    </div>
                  </div>
                  <label for="codeFilter">Expediente</label>
                  <input id="codeFilter" name="codeFilter" placeholder="EXP-0050">
                  <label for="titleFilter">Título</label>
                  <input id="titleFilter" name="titleFilter" placeholder="Texto del asunto">
                  <button class="submit-button" id="submitButton" type="submit">Iniciar sesión y cargar consola</button>
                </form>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Sesión</h2>
                  <p id="sessionLabel">Sin token emitido.</p>
                </div>
                <div class="panel-body">
                  <div class="detail-grid" id="sessionGrid">
                    <div class="item"><span>Usuario</span><strong>-</strong></div>
                    <div class="item"><span>Roles</span><strong>-</strong></div>
                  </div>
                  <button class="submit-button button-danger" id="logoutButton" type="button" hidden>Cerrar sesión</button>
                </div>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Modo presentación</h2>
                  <p>Escenarios rápidos para enseñar casos sin preparar filtros a mano.</p>
                </div>
                <div class="panel-body">
                  <div class="scenario-buttons">
                    <button class="button-secondary" type="button" data-scenario="found">Encontrado</button>
                    <button class="button-secondary" type="button" data-scenario="pending">Pendiente</button>
                    <button class="button-secondary" type="button" data-scenario="recent">Cambio reciente</button>
                    <button class="button-secondary" type="button" data-scenario="empty">Sin resultados</button>
                    <button class="button-secondary" type="button" data-scenario="permission">Permisos</button>
                    <button class="button-secondary" type="button" data-scenario="sync">Sincronización</button>
                  </div>
                </div>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Carpetas demo</h2>
                  <p>Consultas directas sobre la PostgreSQL datos_externos.</p>
                </div>
                <div class="panel-body">
                  <label for="externalSearch">Buscar</label>
                  <input id="externalSearch" placeholder="EXP-0001, pago, persona...">
                  <label for="externalLimit">Límite</label>
                  <input id="externalLimit" value="100" type="number" min="1" max="500">
                  <div class="folder-list" id="folderList" style="margin-top:12px">
                    <button class="folder-button active" type="button" data-folder="expedientes">Expedientes <span>-</span></button>
                    <button class="folder-button" type="button" data-folder="notificaciones">Notificaciones <span>-</span></button>
                    <button class="folder-button" type="button" data-folder="pagos">Pagos <span>-</span></button>
                    <button class="folder-button" type="button" data-folder="citas">Citas <span>-</span></button>
                    <button class="folder-button" type="button" data-folder="personas">Personas <span>-</span></button>
                    <button class="folder-button" type="button" data-folder="semantica">Semántica <span>-</span></button>
                  </div>
                  <button class="submit-button" id="externalLoadButton" type="button">Cargar carpeta</button>
                </div>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Ficha 360 ciudadano</h2>
                  <p>Abre una vista dedicada con toda la información relacionada.</p>
                </div>
                <div class="panel-body">
                  <label for="citizenOpenInput">Ciudadano</label>
                  <input id="citizenOpenInput" value="CIT-10001">
                  <button class="submit-button" id="citizenOpenButton" type="button">Abrir ficha 360</button>
                </div>
              </section>
            </aside>

            <section>
              <div class="kpis" id="kpis">
                <div class="metric"><span>Expedientes</span><strong>0</strong></div>
                <div class="metric"><span>Importe total</span><strong>0 €</strong></div>
                <div class="metric"><span>Incidencias</span><strong>0</strong></div>
                <div class="metric"><span>Última ingesta</span><strong>-</strong></div>
              </div>

              <section class="panel">
                <div class="panel-head">
                  <div class="panel-title">
                    <div>
                      <h2>Expedientes administrativos</h2>
                      <p id="resultLabel">Carga datos para revisar el estado operativo.</p>
                    </div>
                    <div class="actions">
                      <button class="button-secondary" id="csvButton" type="button">CSV</button>
                      <button class="button-secondary" id="jsonButton" type="button">JSON</button>
                    </div>
                  </div>
                </div>
                <div class="panel-body">
                  <div class="toolbar">
                    <input id="quickSearch" placeholder="Filtro rápido en resultados cargados">
                    <div class="actions">
                      <button class="button-secondary" id="recentButton" type="button">Últimos cambios</button>
                      <button class="button-secondary" id="incidentButton" type="button">Incidencias</button>
                      <button class="button-secondary" id="simulateButton" type="button">Simular cambio</button>
                    </div>
                  </div>
                  <div class="table-wrap" id="tableWrap">
                    <div class="empty">Sin resultados todavía.</div>
                  </div>
                </div>
