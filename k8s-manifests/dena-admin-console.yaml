          function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
              "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[char]));
          }

          function walkTextNodes(root, callback) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
              acceptNode(node) {
                const parent = node.parentElement;
                if (!parent || ["SCRIPT", "STYLE", "PRE", "CODE"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
                return node.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
              }
            });
            let node = walker.nextNode();
            while (node) {
              callback(node);
              node = walker.nextNode();
            }
          }

          function translateText(text, lang) {
            if (lang === "es") return text;
            return translations[lang]?.[text] || text;
          }

          function applyLanguage(lang) {
            document.documentElement.lang = lang;
            localStorage.setItem("denaAdminLanguage", lang);
            walkTextNodes(document.body, (node) => {
              const source = node.i18nSource || node.textContent.trim();
              node.i18nSource = source;
              const translated = translateText(source, lang);
              node.textContent = node.textContent.replace(node.textContent.trim(), translated);
            });
            themeToggle.textContent = document.documentElement.dataset.theme === "dark"
              ? translateText("Claro", lang)
              : translateText("Oscuro", lang);
            updatePanelHelp();
          }

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("denaAdminTheme", theme);
            themeToggle.textContent = theme === "dark"
              ? translateText("Claro", languageSelect.value)
              : translateText("Oscuro", languageSelect.value);
          }

          function panelHelpText(panel) {
            const title = panel.querySelector("h2")?.textContent.trim() || "";
            const description = panel.querySelector(".panel-head p")?.textContent.trim() || "";
            const lang = languageSelect.value;
            if (lang === "en") return description ? `${title}: ${description}` : `Shows or hides ${title}.`;
            if (lang === "eu") return description ? `${title}: ${description}` : `${title} panela zabaldu edo tolestu.`;
            return description ? `${title}: ${description}` : `Muestra u oculta el panel ${title}.`;
          }

          function updatePanelHelp() {
            document.querySelectorAll(".panel").forEach((panel) => {
              const help = panel.querySelector(":scope > .panel-head .panel-help");
              const toggle = panel.querySelector(":scope > .panel-head .panel-toggle");
              if (help) {
                help.title = panelHelpText(panel);
                help.setAttribute("aria-label", help.title);
              }
              if (toggle) {
                const collapsed = panel.classList.contains("collapsed");
                const lang = languageSelect.value;
                const label = collapsed
                  ? lang === "en" ? "Expand panel" : lang === "eu" ? "Panela zabaldu" : "Desplegar panel"
                  : lang === "en" ? "Collapse panel" : lang === "eu" ? "Panela tolestu" : "Contraer panel";
                toggle.setAttribute("aria-label", label);
                toggle.title = label;
              }
            });
          }

          function initCollapsiblePanels() {
            document.querySelectorAll(".panel").forEach((panel, index) => {
              const head = panel.querySelector(":scope > .panel-head");
              if (!head || head.querySelector(".panel-toggle")) return;
              const content = Array.from(panel.children).filter((child) => child !== head);
              if (!content.length) return;
              const title = normalize(head.querySelector("h2")?.textContent || `panel-${index}`);
              const key = `denaAdminPanelCollapsed:${title}:${index}`;
              const controls = document.createElement("span");
              controls.className = "panel-controls";
              const button = document.createElement("button");
              button.type = "button";
              button.className = "panel-toggle";
              button.setAttribute("aria-label", "Contraer panel");
              const help = document.createElement("button");
              help.type = "button";
              help.className = "panel-help";
              help.textContent = "?";
              controls.append(button, help);
              head.prepend(controls);
              const setCollapsed = (collapsed) => {
                panel.classList.toggle("collapsed", collapsed);
                content.forEach((node) => node.classList.toggle("panel-content-collapsed", collapsed));
                button.textContent = collapsed ? "+" : "-";
                button.setAttribute("aria-expanded", String(!collapsed));
                const lang = languageSelect.value;
                const label = collapsed
                  ? lang === "en" ? "Expand panel" : lang === "eu" ? "Panela zabaldu" : "Desplegar panel"
                  : lang === "en" ? "Collapse panel" : lang === "eu" ? "Panela tolestu" : "Contraer panel";
                button.setAttribute("aria-label", label);
                button.title = label;
                sessionStorage.setItem(key, collapsed ? "1" : "0");
                updatePanelHelp();
              };
              setCollapsed(sessionStorage.getItem(key) === "1");
              button.addEventListener("click", () => setCollapsed(!panel.classList.contains("collapsed")));
            });
            updatePanelHelp();
          }

          function normalize(value) {
            return String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
          }

          function setStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`.trim();
          }

          function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? "-" : dateTime.format(date);
          }

          function badge(status) {
            return `<span class="badge ${escapeHtml(status || "")}">${escapeHtml(statusLabels[status] || status || "-")}</span>`;
          }

          function decodeJwt(token) {
            if (!token || !token.includes(".")) return {};
            try {
              const payload = token.split(".")[1].replaceAll("-", "+").replaceAll("_", "/");
              return JSON.parse(atob(payload.padEnd(Math.ceil(payload.length / 4) * 4, "=")));
            } catch {
              return {};
            }
          }

          function loadStoredSession() {
            try {
              return JSON.parse(sessionStorage.getItem("denaAdminSession") || "null");
            } catch {
              return null;
            }
          }

          function storeSession(nextSession) {
            session = nextSession;
            sessionStorage.setItem("denaAdminSession", JSON.stringify(nextSession));
            renderSession();
          }

          function clearLocalSession() {
            session = null;
            rows = [];
            visibleRows = [];
            selectedIndex = null;
            sessionStorage.removeItem("denaAdminSession");
            sessionStorage.removeItem("denaAdminPkceVerifier");
            sessionStorage.removeItem("denaAdminPkceState");
            sessionStorage.removeItem("denaAdminPendingLoad");
          }

          function logout() {
            const idToken = session?.id_token;
            clearLocalSession();
            const params = new URLSearchParams({
              client_id: oidc.clientId,
              post_logout_redirect_uri: oidc.redirectUri
            });
            if (idToken) params.set("id_token_hint", idToken);
            window.location.assign(`${oidc.logoutUrl}?${params}`);
          }

          function tokenIsUsable() {
            const claims = decodeJwt(session?.access_token);
            return Boolean(claims.exp && claims.exp * 1000 > Date.now() + 30000);
          }

          function randomBase64Url(bytes = 32) {
            const values = new Uint8Array(bytes);
            crypto.getRandomValues(values);
            return btoa(String.fromCharCode(...values)).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
          }

          async function sha256Base64Url(value) {
            const data = new TextEncoder().encode(value);
            const digest = await crypto.subtle.digest("SHA-256", data);
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
          }

          async function startLogin() {
            if (window.location.origin !== oidcOrigin) {
              window.location.assign(`${oidc.redirectUri}?autoload=1`);
              throw new Error("Redirigiendo a localhost:30080 para completar OIDC/WebAuthn.");
            }
            if (!citizen360View.hidden) {
              sessionStorage.setItem("denaAdminAfterLoginView", JSON.stringify({
                view: "ciudadano360",
                persona: citizen360Input.value || "CIT-10001"
              }));
            }
            const verifier = randomBase64Url(64);
            const state = randomBase64Url(24);
            const challenge = await sha256Base64Url(verifier);
            sessionStorage.setItem("denaAdminPkceVerifier", verifier);
            sessionStorage.setItem("denaAdminPkceState", state);
            sessionStorage.setItem("denaAdminPendingLoad", "1");
            const params = new URLSearchParams({
              client_id: oidc.clientId,
              redirect_uri: oidc.redirectUri,
              response_type: "code",
              scope: "openid",
              state,
              code_challenge: challenge,
              code_challenge_method: "S256"
            });
            window.location.assign(`${oidc.authUrl}?${params}`);
          }

          async function exchangeCode(code, state) {
            const expectedState = sessionStorage.getItem("denaAdminPkceState");
            const verifier = sessionStorage.getItem("denaAdminPkceVerifier");
            if (!expectedState || !verifier || state !== expectedState) throw new Error("Estado OIDC inválido.");
            const response = await fetch(oidc.tokenUrl, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                client_id: oidc.clientId,
                grant_type: "authorization_code",
                code,
                redirect_uri: oidc.redirectUri,
                code_verifier: verifier
              })
            });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Keycloak HTTP ${response.status}: ${text.slice(0, 180)}`);
            }
            sessionStorage.removeItem("denaAdminPkceVerifier");
            sessionStorage.removeItem("denaAdminPkceState");
            storeSession(await response.json());
            window.history.replaceState({}, document.title, oidc.redirectUri);
          }

          async function restoreAfterLoginView() {
            const raw = sessionStorage.getItem("denaAdminAfterLoginView");
            if (!raw) return false;
            sessionStorage.removeItem("denaAdminAfterLoginView");
            try {
              const saved = JSON.parse(raw);
              if (saved.view !== "ciudadano360") return false;
              showCitizen360View();
              citizen360Input.value = saved.persona || "CIT-10001";
              window.history.replaceState({}, document.title, `${oidc.redirectUri}?view=ciudadano360&persona=${encodeURIComponent(citizen360Input.value)}`);
              await loadCitizen360();
              return true;
            } catch {
              return false;
            }
          }

          async function handleAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");
            const error = params.get("error");
            if (error) {
              window.history.replaceState({}, document.title, oidc.redirectUri);
              throw new Error(params.get("error_description") || error);
            }
            if (!code) return false;
            setStatus("Completando autenticación OIDC...");
            await exchangeCode(code, state);
            if (await restoreAfterLoginView()) return true;
            const shouldLoad = sessionStorage.getItem("denaAdminPendingLoad") === "1";
            sessionStorage.removeItem("denaAdminPendingLoad");
            if (shouldLoad) await loadData();
            return true;
          }

          function requestBody() {
            const data = new FormData(form);
            const body = { p_limit: Number(data.get("limit") || 200) };
            if (data.get("statusFilter")) body.p_status = data.get("statusFilter");
            if (data.get("codeFilter")) body.p_code = data.get("codeFilter");
            if (data.get("titleFilter")) body.p_title = data.get("titleFilter");
            return body;
          }

          async function getToken() {
            if (tokenIsUsable()) return session.access_token;
            setStatus("Redirigiendo a Keycloak...");
            await startLogin();
            throw new Error("Redirección a Keycloak iniciada.");
          }

          function renderSession() {
            const claims = decodeJwt(session?.access_token);
            const roles = claims.realm_access?.roles || [];
            const isAdmin = roles.includes("dena-admin");
            sessionLabel.textContent = isAdmin ? "Sesión admin activa." : "Sesión activa sin rol dena-admin.";
            logoutButton.hidden = !session?.access_token;
            sessionGrid.innerHTML = `
              <div class="item"><span>Usuario</span><strong>${escapeHtml(claims.preferred_username || claims.sub || "-")}</strong></div>
              <div class="item"><span>Roles</span><strong>${escapeHtml(roles.filter((role) => role.startsWith("dena-")).join(", ") || "-")}</strong></div>
            `;
            renderPermissions(roles);
            if (!isAdmin) setStatus("Usuario autenticado sin rol dena-admin.", "warn");
          }

          function renderPermissions(roles = []) {
            const profiles = [
              { name: "Ciudadano", allowed: "Consultar expedientes propios", denied: "No ve auditoría ni operación" },
              { name: "Operador", allowed: "Revisar incidencias y trazabilidad", denied: "No modifica permisos" },
              { name: "Admin", allowed: "Auditoría, exportación y simulación", denied: "Sin escritura persistente en esta demo" }
            ];
            permissionPanel.innerHTML = `
              <div class="permission-grid">
                ${profiles.map((profile) => `
                  <div class="permission-card">
                    <strong>${escapeHtml(profile.name)}</strong>
                    <span>Puede: ${escapeHtml(profile.allowed)}</span>
                    <span>Límite: ${escapeHtml(profile.denied)}</span>
                  </div>
                `).join("")}
              </div>
              <div class="citizen-preview">
                <h3>Roles de la sesión actual</h3>
                <p>${escapeHtml(roles.filter((role) => role.startsWith("dena-")).join(", ") || "Sin roles DENA")}</p>
              </div>
            `;
          }

          function incidentCount(data) {
            const now = Date.now();
            return data.filter((row) => {
              const updated = new Date(row.updated_at).getTime();
              return row.status === "pendiente_documentacion" || row.status === "abierto" && now - updated > 7 * 24 * 60 * 60 * 1000;
            }).length;
          }

          function renderKpis(data) {
            const total = data.reduce((sum, row) => sum + Number(row.amount_eur || 0), 0);
            const latestIngest = data
              .map((row) => new Date(row.ingested_at || row.updated_at))
              .filter((date) => !Number.isNaN(date.getTime()))
              .sort((a, b) => b - a)[0];
            kpis.innerHTML = `
              <div class="metric"><span>Expedientes</span><strong>${data.length}</strong></div>
              <div class="metric"><span>Importe total</span><strong>${currency.format(total)}</strong></div>
              <div class="metric"><span>Incidencias</span><strong>${incidentCount(data)}</strong></div>
              <div class="metric"><span>Última ingesta</span><strong>${latestIngest ? formatDate(latestIngest) : "-"}</strong></div>
            `;
          }

          function syncDelay(row) {
            const updated = new Date(row.updated_at).getTime();
            const ingested = new Date(row.ingested_at || row.updated_at).getTime();
            if (Number.isNaN(updated) || Number.isNaN(ingested)) return null;
            return Math.max(0, ingested - updated);
          }

          function delayLabel(ms) {
            if (ms === null) return "sin dato";
            if (ms < 60000) return `${Math.round(ms / 1000)} s`;
            if (ms < 3600000) return `${Math.round(ms / 60000)} min`;
            return `${Math.round(ms / 3600000)} h`;
          }

          async function fetchWithTimeout(url, options = {}, timeoutMs = 4500) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
              return await fetch(url, { ...options, signal: controller.signal });
            } finally {
              clearTimeout(timeout);
            }
          }

          function renderStackSummary(checks) {
            const okCount = checks.filter((check) => check.state === "ok").length;
            const warnCount = checks.filter((check) => check.state === "warn").length;
            const badCount = checks.filter((check) => check.state === "bad").length;
            const total = checks.length || 1;
            const state = badCount ? "bad" : warnCount ? "warn" : "ok";
            const label = badCount ? "Revisar incidencias" : warnCount ? "Operativo con avisos" : "Operativo";
            const detail = `${okCount}/${total} checks OK · ${warnCount} avisos · ${badCount} errores`;
            stackSummary.innerHTML = `
              <div class="stack-score ${state}">${okCount}/${total}</div>
              <div class="stack-copy">
                <strong>${escapeHtml(label)}</strong>
                <span>${escapeHtml(detail)}</span>
              </div>
            `;
          }

          function renderHealthChecks(checks) {
            healthPanel.innerHTML = checks.map((check) => `
              <div class="health-row ${escapeHtml(check.state)}">
                <div>
                  <strong>${escapeHtml(check.name)}</strong>
                  <small>${escapeHtml(check.detail)}</small>
                </div>
                <span class="health-state">${escapeHtml(check.label)}</span>
              </div>
            `).join("");
            healthUpdated.textContent = `Última revisión: ${dateTime.format(new Date())}`;
            renderStackSummary(checks);
          }

          async function runHealthCheck(name, detail, check) {
            const started = performance.now();
            try {
              const result = await check();
              return {
                name,
                detail: result.detail || detail,
                state: result.state || "ok",
                label: result.label || `${Math.round(performance.now() - started)} ms`
              };
            } catch (error) {
              return {
                name,
                detail: error.message || detail,
                state: "bad",
                label: "error"
              };
            }
          }

          async function refreshHealth({ silent = false } = {}) {
            healthRefreshButton.disabled = true;
            if (!silent) setStatus("Revisando estado operativo...");
            const token = tokenIsUsable() ? session.access_token : null;
            const checks = await Promise.all([
              runHealthCheck("Keycloak", "Discovery OIDC público", async () => {
                const response = await fetchWithTimeout("/realms/piloto/.well-known/openid-configuration");
                if (!response.ok) throw new Error(`Discovery HTTP ${response.status}`);
                const discovery = await response.json();
                return { detail: discovery.issuer ? "Realm piloto disponible" : "Discovery sin issuer", state: discovery.issuer ? "ok" : "warn" };
              }),
              runHealthCheck("APISIX", "Gateway y política OIDC", async () => {
                const response = await fetchWithTimeout("/api/");
                if (response.status === 401) return { detail: "API protegida rechaza tráfico sin token", state: "ok" };
                if (response.ok) return { detail: "Gateway responde, pero la API no rechazó sin token", state: "warn", label: `HTTP ${response.status}` };
                throw new Error(`Gateway HTTP ${response.status}`);
              }),
              runHealthCheck("API DENA", "RPC /dena/admin-files", async () => {
                if (!token) return { detail: "Requiere sesión admin para prueba autenticada", state: "warn", label: "sin sesión" };
                const response = await fetchWithTimeout("/dena/admin-files", {
                  method: "POST",
                  headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                  body: JSON.stringify({ p_limit: 1 })
                });
                if (!response.ok) throw new Error(`API HTTP ${response.status}`);
                const data = await response.json();
                return { detail: `${Array.isArray(data) ? data.length : 0} fila de prueba recuperada`, state: "ok" };
              }),
              runHealthCheck("Datos externos", "PostgREST datos_externos vía /dena/external", async () => {
                if (!token) return { detail: "Requiere sesión admin para prueba autenticada", state: "warn", label: "sin sesión" };
                const response = await fetchWithTimeout("/dena/external/dena_external_folders?select=folder_id,title,total&order=folder_id.asc", {
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`Datos externos HTTP ${response.status}`);
                const data = await response.json();
                return { detail: `${Array.isArray(data) ? data.length : 0} carpetas publicadas`, state: Array.isArray(data) && data.length >= 6 ? "ok" : "warn" };
              }),
              runHealthCheck("Sesión", "Token y roles DENA", async () => {
                const claims = decodeJwt(session?.access_token);
                const roles = claims.realm_access?.roles || [];
                if (!session?.access_token) return { detail: "Sin sesión activa", state: "warn", label: "pendiente" };
                if (!tokenIsUsable()) return { detail: "Token caducado o próximo a caducar", state: "warn", label: "renovar" };
                if (!roles.includes("dena-admin")) return { detail: "Sesión sin rol dena-admin", state: "warn", label: "rol limitado" };
                return { detail: `${claims.preferred_username || "usuario"} con rol dena-admin`, state: "ok" };
              })
            ]);
            renderHealthChecks(checks);
            renderFlow(checks.some((check) => check.name === "API DENA" && check.state === "ok"));
            if (!silent) {
              const badCount = checks.filter((check) => check.state === "bad").length;
              setStatus(badCount ? `Estado operativo con ${badCount} errores.` : "Estado operativo revisado.", badCount ? "bad" : "ok");
            }
            healthRefreshButton.disabled = false;
          }

          function rowIncidents(row) {
            const issues = [];
            const updated = new Date(row.updated_at).getTime();
            const now = Date.now();
            if (row.status === "pendiente_documentacion") issues.push("Documentación pendiente");
            if (row.status === "abierto" && !Number.isNaN(updated) && now - updated > 7 * 24 * 60 * 60 * 1000) issues.push("Abierto hace más de 7 días");
            if (Number(row.amount_eur || 0) > 9000) issues.push("Importe alto");
            const delay = syncDelay(row);
            if (delay !== null && delay > 10 * 60 * 1000) issues.push("Ingesta retrasada");
            if (simulatedChanges[row.expediente_code]) issues.push("Cambio simulado pendiente de sincronizar");
            return issues;
          }

          function applyQuickFilter(mode = "") {
            const query = normalize(quickSearch.value);
            visibleRows = rows.filter((row) => {
              const haystack = normalize([row.expediente_code, row.title, row.citizen_id, row.source_system, row.status].join(" "));
              if (query && !haystack.includes(query)) return false;
              if (mode === "incident") return row.status === "pendiente_documentacion" || row.status === "abierto";
              return true;
            });
            if (mode === "recent") {
              visibleRows = [...visibleRows].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)).slice(0, 10);
            }
            renderKpis(visibleRows);
            renderTable();
            renderIncidentPanel();
          }

          function renderTable() {
            selectedIndex = visibleRows.length ? 0 : null;
            resultLabel.textContent = visibleRows.length ? `${visibleRows.length} expedientes visibles.` : "No hay expedientes para los filtros seleccionados.";
            if (!visibleRows.length) {
              tableWrap.innerHTML = '<div class="empty">Sin resultados.</div>';
              renderDetail(null);
              return;
            }
            tableWrap.innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>Expediente</th><th>Estado</th><th>Título</th><th>Origen</th><th>Importe</th><th>Actualizado</th><th>Ingestado</th>
                  </tr>
                </thead>
                <tbody>
                  ${visibleRows.map((row, index) => `
                    <tr data-index="${index}" class="${index === 0 ? "selected" : ""}">
                      <td class="code">${escapeHtml(row.expediente_code || row.id)}</td>
                      <td>${badge(row.status)}</td>
                      <td>${escapeHtml(row.title)}<br><span class="muted">${escapeHtml(row.citizen_id || "-")}</span></td>
                      <td>${escapeHtml(row.source_system || "-")}</td>
                      <td>${currency.format(Number(row.amount_eur || 0))}</td>
                      <td>${formatDate(row.updated_at)}</td>
                      <td>${formatDate(row.ingested_at)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;
            renderDetail(visibleRows[0]);
            renderCompare(visibleRows[0]);
          }

          function renderDetail(row) {
            if (!row) {
              detailPanel.innerHTML = '<div class="empty">Selecciona un expediente.</div>';
              return;
            }
            detailPanel.innerHTML = `
              <div class="detail-grid">
                <div class="item"><span>Expediente</span><strong>${escapeHtml(row.expediente_code || row.id)}</strong></div>
                <div class="item"><span>Estado</span><strong>${escapeHtml(statusLabels[row.status] || row.status || "-")}</strong></div>
                <div class="item"><span>Ciudadano</span><strong>${escapeHtml(row.citizen_id || "-")}</strong></div>
                <div class="item"><span>Importe</span><strong>${currency.format(Number(row.amount_eur || 0))}</strong></div>
              </div>
              <div class="trace" style="margin-top:14px">
                <div class="timeline-item"><strong>Historial del expediente</strong><span>Creado: ${formatDate(row.opened_at)} · Última modificación: ${formatDate(row.updated_at)}</span></div>
                <div class="trace-step"><div class="dot"></div><div><strong>Origen vertical</strong><span>${escapeHtml(row.source_system || "verticales-local")} · ${formatDate(row.updated_at)}</span></div></div>
                <div class="trace-step"><div class="dot"></div><div><strong>NiFi</strong><span>Flujo de ingesta a staging y consolidación</span></div></div>
                <div class="trace-step"><div class="dot"></div><div><strong>Datalake</strong><span>Ingestado ${formatDate(row.ingested_at)} · retardo ${delayLabel(syncDelay(row))}</span></div></div>
                <div class="trace-step"><div class="dot"></div><div><strong>API protegida</strong><span>PostgREST detrás de APISIX + Keycloak</span></div></div>
              </div>
              <div class="citizen-preview">
                <h3>Vista ciudadana sugerida</h3>
                <p>${escapeHtml(citizenMessage(row))}</p>
                <p>Próximo paso: ${escapeHtml(nextStep(row))}</p>
              </div>
            `;
            renderCompare(row);
          }

          function citizenMessage(row) {
            if (row.status === "resuelto") return "Tu expediente está resuelto. Puedes descargar o consultar el justificante cuando esté disponible.";
            if (row.status === "pendiente_documentacion") return "Tu expediente requiere documentación adicional para poder continuar la tramitación.";
            if (row.status === "en_tramitacion") return "Tu expediente está siendo revisado por la administración competente.";
            if (row.status === "archivado") return "Tu expediente está archivado. Si necesitas reabrirlo, contacta con el organismo responsable.";
            return "Tu expediente está abierto y pendiente de las siguientes actuaciones administrativas.";
          }

          function nextStep(row) {
            if (row.status === "pendiente_documentacion") return "aportar documentación pendiente";
            if (row.status === "resuelto") return "revisar resolución";
            if (row.status === "archivado") return "sin acciones previstas";
            return "esperar actualización del organismo";
          }

          function renderCompare(row) {
            if (!row) {
              comparePanel.innerHTML = '<div class="empty">Selecciona un expediente.</div>';
              return;
            }
            const simulated = simulatedChanges[row.expediente_code];
            const rowsHtml = [
              ["Estado", simulated?.status || row.status, row.status],
              ["Importe", simulated?.amount_eur ? currency.format(Number(simulated.amount_eur)) : currency.format(Number(row.amount_eur || 0)), currency.format(Number(row.amount_eur || 0))],
              ["Actualizado en origen", simulated?.updated_at ? formatDate(simulated.updated_at) : formatDate(row.updated_at), formatDate(row.updated_at)],
              ["Ingestado en datalake", simulated ? "pendiente demo" : formatDate(row.ingested_at), formatDate(row.ingested_at)]
            ].map(([label, origin, lake]) => {
              const differs = origin !== lake;
              return `
                <div class="compare-row ${differs ? "warn" : "ok"}">
                  <strong>${escapeHtml(label)}</strong>
                  <span>Origen: ${escapeHtml(origin)}</span>
                  <span>Datalake: ${escapeHtml(lake)}</span>
                </div>
              `;
            }).join("");
            comparePanel.innerHTML = `<div class="compare-list">${rowsHtml}</div>`;
          }

          function renderIncidentPanel() {
            const items = visibleRows
              .map((row) => ({ row, issues: rowIncidents(row) }))
              .filter((item) => item.issues.length)
              .slice(0, 8);
            if (!items.length) {
              incidentPanel.innerHTML = '<div class="empty">No hay incidencias para los resultados visibles.</div>';
              return;
            }
            incidentPanel.innerHTML = `
              <div class="notifications">
                ${items.map(({ row, issues }) => `
                  <div class="notification warn">
                    <strong>${escapeHtml(row.expediente_code)} · ${escapeHtml(statusLabels[row.status] || row.status)}</strong>
                    <span>${escapeHtml(issues.join(" · "))}</span>
                  </div>
                `).join("")}
              </div>
            `;
          }

          function addNotification(type, title, message) {
            notifications.unshift({ type, title, message, at: new Date().toISOString() });
            notifications = notifications.slice(0, 8);
            renderNotifications();
          }

          function renderNotifications() {
            if (!notifications.length) {
              notificationPanel.innerHTML = '<div class="empty">Sin eventos todavía.</div>';
              return;
            }
            notificationPanel.innerHTML = `
              <div class="notifications">
                ${notifications.map((note) => `
                  <div class="notification ${escapeHtml(note.type)}">
                    <strong>${escapeHtml(note.title)}</strong>
                    <span>${escapeHtml(note.message)}</span>
                    <span>${formatDate(note.at)}</span>
                  </div>
                `).join("")}
              </div>
            `;
          }

          function renderHealth(dataOk = false) {
            renderFlow(dataOk);
            refreshHealth({ silent: true });
          }

          function renderFlow(dataOk = false) {
            const claims = decodeJwt(session?.access_token);
            const nodes = [
              ["Admin", claims.preferred_username || "pendiente"],
              ["APISIX", "gateway 200"],
              ["Keycloak", session ? "token OK" : "pendiente"],
              ["PostgREST", dataOk ? "RPC OK" : "pendiente"],
              ["Datalake", `${rows.length} filas`],
              ["NiFi", "sincronización activa"]
            ];
            flowPanel.innerHTML = `
              <div class="flow-map">
                ${nodes.map(([name, state]) => `<div class="flow-node"><strong>${escapeHtml(name)}</strong><span>${escapeHtml(state)}</span></div>`).join("")}
              </div>
            `;
          }

          function renderAudit(durationMs, body) {
            const claims = decodeJwt(session?.access_token);
            lastAudit = {
              usuario: claims.preferred_username || claims.sub || "-",
              endpoint: "/dena/admin-files",
              filtros: body,
              filas: rows.length,
              duracion_ms: durationMs,
              fecha: new Date().toISOString()
            };
            auditPanel.textContent = JSON.stringify(lastAudit, null, 2);
          }

          async function loadData() {
            submitButton.disabled = true;
            setStatus("Autenticando admin...");
            const started = performance.now();
            const body = requestBody();
            try {
              const token = await getToken();
              setStatus("Consultando datalake...");
              const response = await fetch("/dena/admin-files", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
              });
              if (response.status === 401 || response.status === 403) {
                clearLocalSession();
                setStatus("Sesión no válida. Reautenticando...");
                await startLogin();
                return;
              }
              if (!response.ok) {
                const text = await response.text();
                throw new Error(`API HTTP ${response.status}: ${text.slice(0, 180)}`);
              }
              rows = await response.json();
              visibleRows = rows;
              renderKpis(visibleRows);
              renderTable();
              renderIncidentPanel();
              renderHealth(true);
              renderAudit(Math.round(performance.now() - started), body);
              addNotification("ok", "Consulta completada", `${rows.length} expedientes recuperados desde la API DENA.`);
              setStatus(`Consola cargada: ${rows.length} expedientes.`, "ok");
            } catch (error) {
              if (error.message === "Redirección a Keycloak iniciada.") {
                setStatus("Redirigiendo a Keycloak...");
                return;
              }
              tableWrap.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              renderHealth(false);
              addNotification("bad", "Error de consulta", error.message || String(error));
              setStatus(`No se pudo cargar la consola: ${error.message || error}`, "bad");
            } finally {
              submitButton.disabled = false;
            }
          }

          function download(name, content, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = name;
            link.click();
            URL.revokeObjectURL(url);
          }

          function toCsv(data) {
            const headers = ["expediente_code", "status", "title", "citizen_id", "source_system", "amount_eur", "updated_at", "ingested_at"];
            return [headers.join(",")].concat(data.map((row) => headers.map((key) => `"${String(row[key] ?? "").replaceAll('"', '""')}"`).join(","))).join("\n");
          }

          async function fetchExternal(path) {
            const token = await getToken();
            const response = await fetch(`/dena/external/${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (!response.ok) throw new Error(`Datos externos HTTP ${response.status}`);
            return response.json();
          }

          function renderFolderButtons() {
            folderList.querySelectorAll("[data-folder]").forEach((button) => {
              const folder = button.dataset.folder;
              const meta = externalFolders[folder] || {};
              button.classList.toggle("active", folder === activeExternalFolder);
              button.innerHTML = `${escapeHtml(meta.title || folder)} <span>${escapeHtml(meta.total ?? "-")}</span>`;
            });
          }

          async function loadExternalFolders() {
            try {
              const folders = await fetchExternal("dena_external_folders?select=*&order=folder_id.asc");
              folders.forEach((folder) => {
                externalFolders[folder.folder_id] = {
                  title: folder.title,
                  endpoint: folder.endpoint,
                  total: folder.total
                };
              });
              renderFolderButtons();
            } catch (error) {
              addNotification("warn", "Carpetas no disponibles", error.message || String(error));
            }
          }

          function externalDisplayValue(row, keys, fallback = "-") {
            for (const key of keys) {
              if (row[key] !== undefined && row[key] !== null && row[key] !== "") return row[key];
            }
            return fallback;
          }

          function openCitizen360Tab() {
            const persona = (citizenOpenInput.value || "CIT-10001").trim();
            const target = `${oidc.redirectUri}?view=ciudadano360&persona=${encodeURIComponent(persona)}`;
            window.open(target, "_blank");
          }

          function showCitizen360View() {
            adminLayout.hidden = true;
            citizen360View.hidden = false;
          }

          function showAdminView() {
            citizen360View.hidden = true;
            adminLayout.hidden = false;
            window.history.replaceState({}, document.title, oidc.redirectUri);
          }

          function citizen360AlertCount(data) {
            const pendingDocs = data.expedientes.filter((row) => String(row.estado || "").includes("WAITING") || String(row.estado || "").includes("PENDING")).length;
            const unread = data.notificaciones.filter((row) => !row.leido_en).length;
            const paymentIssues = data.pagos.filter((row) => /PENDING|REJECTED|ERROR/i.test(row.estado || "")).length;
            const nextAppointments = data.citas.filter((row) => new Date(row.fecha).getTime() > Date.now()).length;
            return pendingDocs + unread + paymentIssues + nextAppointments;
          }

          function renderCitizen360Summary(data) {
            const totalAmount = data.pagos.reduce((sum, row) => sum + Number(row.importe_eur || 0), 0);
            const alerts = citizen360AlertCount(data);
            citizen360Summary.innerHTML = `
              <div class="metric"><span>Expedientes</span><strong>${data.expedientes.length}</strong></div>
              <div class="metric"><span>Notificaciones</span><strong>${data.notificaciones.length}</strong></div>
              <div class="metric"><span>Pagos</span><strong>${data.pagos.length}</strong></div>
              <div class="metric"><span>Citas</span><strong>${data.citas.length}</strong></div>
              <div class="metric"><span>Importe</span><strong>${currency.format(totalAmount)}</strong></div>
              <div class="metric"><span>Alertas</span><strong>${alerts}</strong></div>
            `;
          }

          function renderCitizen360Tabs() {
            const tabs = [
              ["persona", "Identidad"],
              ["expedientes", "Expedientes"],
              ["notificaciones", "Notificaciones"],
              ["pagos", "Pagos"],
              ["citas", "Citas"],
              ["alertas", "Alertas"]
            ];
            citizen360Tabs.innerHTML = tabs.map(([id, label]) => `
              <button class="${id === activeCitizen360Tab ? "active" : ""}" type="button" data-citizen-tab="${id}">
                ${escapeHtml(label)}
              </button>
            `).join("");
          }

          function renderCitizen360Cards(rows, emptyLabel) {
            if (!rows.length) return `<div class="empty">${escapeHtml(emptyLabel)}</div>`;
            return `
              <div class="notifications">
                ${rows.map((row) => `
                  <div class="notification ok">
                    <strong>${escapeHtml(externalDisplayValue(row, ["referencia", "id", "titulo"]))}</strong>
                    <span>${escapeHtml(externalDisplayValue(row, ["titulo", "tipo", "estado", "prioridad"]))}</span>
                    <span>${escapeHtml(externalDisplayValue(row, ["estado", "servicio", "administracion", "ubicacion"]))} · ${formatDate(externalDisplayValue(row, ["fecha", "sincronizado_en"], ""))}</span>
                  </div>
                `).join("")}
              </div>
            `;
          }

          function renderCitizen360Alerts(data) {
            const alerts = [];
            data.expedientes.forEach((row) => {
              if (/WAITING|PENDING/i.test(row.estado || "")) alerts.push(["warn", row.referencia || row.id, "Expediente con actuación pendiente."]);
            });
            data.notificaciones.forEach((row) => {
              if (!row.leido_en) alerts.push(["warn", row.id, "Notificación sin lectura registrada."]);
            });
            data.pagos.forEach((row) => {
              if (/PENDING|REJECTED|ERROR/i.test(row.estado || "")) alerts.push(["bad", row.id, `Pago en estado ${row.estado || "pendiente"}.`]);
            });
            data.citas.forEach((row) => {
              if (new Date(row.fecha).getTime() > Date.now()) alerts.push(["ok", row.id, `Cita próxima: ${formatDate(row.fecha)}.`]);
            });
            if (!alerts.length) return '<div class="empty">Sin alertas funcionales para este ciudadano.</div>';
            return `
              <div class="notifications">
                ${alerts.map(([type, title, message]) => `
                  <div class="notification ${escapeHtml(type)}">
                    <strong>${escapeHtml(title)}</strong>
                    <span>${escapeHtml(message)}</span>
                  </div>
                `).join("")}
              </div>
            `;
          }

          function renderCitizen360Results() {
            if (!citizen360Data) {
              citizen360Results.innerHTML = '<div class="empty">Sin ficha cargada.</div>';
              return;
            }
            renderCitizen360Tabs();
            const data = citizen360Data;
            citizen360ResultLabel.textContent = `${data.personaId}: ${data.expedientes.length} expedientes, ${data.notificaciones.length} notificaciones, ${data.pagos.length} pagos y ${data.citas.length} citas.`;
            if (activeCitizen360Tab === "persona") {
              const person = data.personas[0] || {};
              citizen360Results.innerHTML = `
                <div class="detail-grid">
                  <div class="item"><span>Ciudadano</span><strong>${escapeHtml(data.personaId)}</strong></div>
                  <div class="item"><span>Nombre</span><strong>${escapeHtml(person.titulo || data.expedientes[0]?.persona_nombre || "-")}</strong></div>
                  <div class="item"><span>Email</span><strong>${escapeHtml(person.email || "-")}</strong></div>
                  <div class="item"><span>Teléfono</span><strong>${escapeHtml(person.telefono || "-")}</strong></div>
                  <div class="item"><span>Idioma</span><strong>${escapeHtml(person.idioma || "-")}</strong></div>
                  <div class="item"><span>Unidad</span><strong>${escapeHtml(person.unidad || "-")}</strong></div>
                </div>
              `;
              return;
            }
            if (activeCitizen360Tab === "alertas") {
              citizen360Results.innerHTML = renderCitizen360Alerts(data);
              return;
            }
            citizen360Results.innerHTML = renderCitizen360Cards(data[activeCitizen360Tab] || [], "Sin datos en esta categoría.");
          }

          async function loadCitizen360() {
            citizen360LoadButton.disabled = true;
            const personaId = (citizen360Input.value || "CIT-10001").trim();
            try {
              setStatus(`Cargando ficha 360 de ${personaId}...`);
              const filter = `persona_id=eq.${encodeURIComponent(personaId)}`;
              const [personas, expedientes, notificaciones, pagos, citas] = await Promise.all([
                fetchExternal(`dena_external_personas?select=*&${filter}&limit=1`),
                fetchExternal(`dena_external_expedientes?select=*&${filter}&order=fecha.desc.nullslast&limit=50`),
                fetchExternal(`dena_external_notificaciones?select=*&${filter}&order=fecha.desc.nullslast&limit=50`),
                fetchExternal(`dena_external_pagos?select=*&${filter}&order=fecha.desc.nullslast&limit=50`),
                fetchExternal(`dena_external_citas?select=*&${filter}&order=fecha.asc.nullslast&limit=50`)
              ]);
              citizen360Data = { personaId, personas, expedientes, notificaciones, pagos, citas };
              citizen360Label.textContent = `Vista consolidada de ${personaId}.`;
              renderCitizen360Summary(citizen360Data);
              renderCitizen360Results();
              addNotification("ok", "Ficha 360 cargada", `${personaId}: ${expedientes.length} expedientes relacionados.`);
              setStatus(`Ficha 360 cargada: ${personaId}.`, "ok");
            } catch (error) {
              citizen360Results.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              addNotification("bad", "Error ficha 360", error.message || String(error));
              setStatus("No se pudo cargar la ficha 360.", "bad");
            } finally {
              citizen360LoadButton.disabled = false;
            }
          }

          function filterExternalRows() {
            const query = normalize(externalSearch.value);
            visibleExternalRows = externalRows.filter((row) => {
              if (!query) return true;
              return normalize(Object.values(row).map((value) => typeof value === "object" ? JSON.stringify(value) : value).join(" ")).includes(query);
            });
            renderExternalTable();
          }

          function renderExternalTable() {
            const folderTitle = externalFolders[activeExternalFolder]?.title || activeExternalFolder;
            externalResultLabel.textContent = `${folderTitle}: ${visibleExternalRows.length} filas visibles.`;
            if (!visibleExternalRows.length) {
              externalTableWrap.innerHTML = '<div class="empty">Sin resultados en esta carpeta.</div>';
              renderExternalDetail(null);
              return;
            }
            externalTableWrap.innerHTML = `
              <table class="external-table">
                <thead>
                  <tr>
                    <th>ID</th><th>Título</th><th>Estado</th><th>Relacionado</th><th>Fecha</th>
                  </tr>
                </thead>
                <tbody>
                  ${visibleExternalRows.map((row, index) => `
                    <tr data-external-index="${index}" class="${index === 0 ? "selected" : ""}">
                      <td class="code">${escapeHtml(externalDisplayValue(row, ["id", "referencia"]))}</td>
                      <td>${escapeHtml(externalDisplayValue(row, ["titulo", "servicio", "tabla_sugerida"]))}</td>
                      <td>${escapeHtml(externalDisplayValue(row, ["estado", "tipo", "prioridad", "grupo", "version"]))}</td>
                      <td>${escapeHtml(externalDisplayValue(row, ["expediente_id", "persona_id", "administracion", "unidad"]))}</td>
                      <td>${formatDate(externalDisplayValue(row, ["fecha", "sincronizado_en", "creado_en"], ""))}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;
            renderExternalDetail(visibleExternalRows[0]);
          }

          function renderExternalDetail(row) {
            if (!row) {
              externalDetailPanel.innerHTML = '<div class="empty">Selecciona una fila.</div>';
              return;
            }
            const fields = Object.entries(row)
              .filter(([key]) => key !== "detalle")
              .slice(0, 12)
              .map(([key, value]) => `
                <div class="item">
                  <span>${escapeHtml(key)}</span>
                  <strong>${escapeHtml(value instanceof Object ? JSON.stringify(value) : value)}</strong>
                </div>
              `).join("");
            externalDetailPanel.innerHTML = `
              <div class="detail-grid">${fields}</div>
              <div style="margin-top:12px">
                <pre>${escapeHtml(JSON.stringify(row.detalle || row, null, 2))}</pre>
              </div>
            `;
          }

          async function loadExternalData() {
            externalLoadButton.disabled = true;
            externalRefreshButton.disabled = true;
            const meta = externalFolders[activeExternalFolder];
            const limit = Math.min(500, Math.max(1, Number(externalLimit.value || 100)));
            try {
              setStatus(`Consultando ${meta.title} en datos_externos...`);
              externalRows = await fetchExternal(`${meta.endpoint}?select=*&order=fecha.desc.nullslast&limit=${limit}`);
              filterExternalRows();
              await loadExternalFolders();
              addNotification("ok", "Carpeta cargada", `${externalRows.length} filas recuperadas de ${meta.title}.`);
              setStatus(`Explorador cargado: ${meta.title}.`, "ok");
            } catch (error) {
              externalTableWrap.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              renderExternalDetail(null);
              addNotification("bad", "Error datos externos", error.message || String(error));
              setStatus("No se pudo cargar datos_externos.", "bad");
            } finally {
              externalLoadButton.disabled = false;
              externalRefreshButton.disabled = false;
            }
          }

          form.addEventListener("submit", (event) => {
            event.preventDefault();
            loadData();
          });
          folderList.addEventListener("click", (event) => {
            const button = event.target.closest("[data-folder]");
            if (!button) return;
            activeExternalFolder = button.dataset.folder;
            renderFolderButtons();
            loadExternalData();
          });
          externalSearch.addEventListener("input", filterExternalRows);
          externalLoadButton.addEventListener("click", loadExternalData);
          externalRefreshButton.addEventListener("click", loadExternalData);
          healthRefreshButton.addEventListener("click", () => refreshHealth());
          citizenOpenButton.addEventListener("click", openCitizen360Tab);
          citizen360LoadButton.addEventListener("click", loadCitizen360);
          citizen360BackButton.addEventListener("click", showAdminView);
          citizen360Tabs.addEventListener("click", (event) => {
            const button = event.target.closest("[data-citizen-tab]");
            if (!button) return;
            activeCitizen360Tab = button.dataset.citizenTab;
            renderCitizen360Results();
          });
          externalTableWrap.addEventListener("click", (event) => {
            const row = event.target.closest("tr[data-external-index]");
            if (!row) return;
            externalTableWrap.querySelectorAll("tr.selected").forEach((node) => node.classList.remove("selected"));
            row.classList.add("selected");
            renderExternalDetail(visibleExternalRows[Number(row.dataset.externalIndex)]);
          });
          quickSearch.addEventListener("input", () => applyQuickFilter());
          recentButton.addEventListener("click", () => applyQuickFilter("recent"));
          incidentButton.addEventListener("click", () => applyQuickFilter("incident"));
          csvButton.addEventListener("click", () => download("dena-admin-expedientes.csv", toCsv(visibleRows), "text/csv"));
          jsonButton.addEventListener("click", () => download("dena-admin-expedientes.json", JSON.stringify(visibleRows, null, 2), "application/json"));
          logoutButton.addEventListener("click", logout);
          tableWrap.addEventListener("click", (event) => {
            const row = event.target.closest("tr[data-index]");
            if (!row) return;
            selectedIndex = Number(row.dataset.index);
            tableWrap.querySelectorAll("tr.selected").forEach((node) => node.classList.remove("selected"));
            row.classList.add("selected");
            renderDetail(visibleRows[selectedIndex]);
          });

          simulateButton.addEventListener("click", () => {
            const row = visibleRows[selectedIndex ?? 0];
            if (!row) return;
            const nextStatus = row.status === "pendiente_documentacion" ? "en_tramitacion" : "pendiente_documentacion";
            simulatedChanges[row.expediente_code] = {
              status: nextStatus,
              amount_eur: Number(row.amount_eur || 0) + 125,
              updated_at: new Date().toISOString()
            };
            addNotification("warn", "Cambio simulado en origen", `${row.expediente_code} pasaría a ${statusLabels[nextStatus]}. No se persiste hasta validarlo.`);
            renderDetail(row);
            renderIncidentPanel();
            setStatus("Cambio simulado generado. Revisa Origen vs datalake.", "warn");
          });

          document.querySelectorAll("[data-scenario]").forEach((button) => {
            button.addEventListener("click", () => {
              const scenario = button.dataset.scenario;
              form.reset();
              form.limit.value = "200";
              if (scenario === "found") form.codeFilter.value = "EXP-0050";
              if (scenario === "pending") form.statusFilter.value = "pendiente_documentacion";
              if (scenario === "recent") form.limit.value = "10";
              if (scenario === "empty") form.codeFilter.value = "EXP-SIN-RESULTADOS";
              if (scenario === "permission") {
                addNotification("ok", "Escenario permisos", "Compara ciudadano, operador y admin en el panel de permisos.");
                renderPermissions(decodeJwt(session?.access_token).realm_access?.roles || []);
              }
              if (scenario === "sync") {
                form.codeFilter.value = "EXP-0050";
                addNotification("warn", "Escenario sincronización", "Carga EXP-0050 y usa Simular cambio para ver la diferencia origen/datalake.");
              }
              loadData();
            });
          });

          languageSelect.value = localStorage.getItem("denaAdminLanguage") || "es";
          applyTheme(localStorage.getItem("denaAdminTheme") || "light");
          initCollapsiblePanels();
          applyLanguage(languageSelect.value);
          languageSelect.addEventListener("change", () => applyLanguage(languageSelect.value));
          themeToggle.addEventListener("click", () => {
            applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
          });
          const bootParams = new URLSearchParams(window.location.search);
          if (bootParams.get("view") === "ciudadano360") {
            showCitizen360View();
            citizen360Input.value = bootParams.get("persona") || "CIT-10001";
            activeCitizen360Tab = "persona";
            if (session?.access_token) loadCitizen360();
          }
          if (session?.access_token) {
            renderSession();
            loadExternalFolders();
          }
          else logoutButton.hidden = true;
          refreshHealth({ silent: true });
          handleAuthCallback()
            .then((handled) => {
              const params = new URLSearchParams(window.location.search);
              if (!handled && params.get("autoload") === "1") loadData();
            })
            .catch((error) => {
              tableWrap.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
              setStatus(`No se pudo completar la autenticación: ${error.message || error}`, "bad");
            });
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dena-admin-console
  namespace: app
  labels:
    app: dena-admin-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dena-admin-console
  template:
    metadata:
      labels:
        app: dena-admin-console
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: dena-admin-console
---
apiVersion: v1
kind: Service
metadata:
  name: dena-admin-console
  namespace: app
  labels:
    app: dena-admin-console
spec:
  type: ClusterIP
  selector:
    app: dena-admin-console
  ports:
    - name: http
      port: 80
      targetPort: http
