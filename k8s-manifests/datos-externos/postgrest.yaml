apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest-datos-externos
  namespace: datos-externos
  labels:
    app: postgrest-datos-externos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest-datos-externos
  template:
    metadata:
      labels:
        app: postgrest-datos-externos
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v13.0.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgrest-datos-externos-secret
                  key: db-uri
            - name: PGRST_DB_ANON_ROLE
              value: dena_external_anon
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_DB_SCHEMAS
              value: public
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: http://192.168.56.15:30080/dena/external
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest-datos-externos
  namespace: datos-externos
  labels:
    app: postgrest-datos-externos
spec:
  type: ClusterIP
  selector:
    app: postgrest-datos-externos
  ports:
    - name: http
      port: 3000
      targetPort: http
